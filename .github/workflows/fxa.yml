name: fxa-mono

# amd64 and arm64 builds of Mozilla's accounts image (mozilla/fxa-mono, published for
# amd64 only) from the upstream release tags, tested with tests/e2e-fxa.sh and
# tests/podman.sh on both architectures, and an upgrade from the published release
# with tests/fxa-upgrade.sh, before the multi-arch tags are published (and on
# MariaDB, without holding back the publishing, see test-mariadb).
# Experimental, see FXA.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FxA release tag to build (vX.Y.Z), default: newest release"
        type: string
        default: ""
      rebuild:
        description: Build even if an image for this release exists
        type: boolean
        default: false
  schedule:
    - cron: '45 6 * * 1' # every Monday, after the syncstorage-rs build
  push:
    paths:
      - .github/workflows/fxa.yml

env:
  REPOSITORY_REGISTRY: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}
  FXA_REPOSITORY: mozilla/fxa
  PAIRING_REPOSITORY: mozilla-services/channelserver

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.existing.outputs.build }}
      pairing_version: ${{ steps.pairing.outputs.version }}
      build_pairing: ${{ steps.pairing.outputs.build }}
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick the release
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED}"
          if [ -z "${version}" ]; then
            version=$(git ls-remote --tags "https://github.com/${FXA_REPOSITORY}" 'refs/tags/v*' | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          # used in a checkout ref and in image tags: only accept a release tag
          if ! [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: '${version}'"
            exit 1
          fi
          echo "FxA release: ${version}"
          echo "version=${version}" >> ${GITHUB_OUTPUT}

      - name: Look for an existing image
        id: existing
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          image="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-mono-${{ steps.version.outputs.version }}"
          if [ "${REBUILD}" != true ] && docker buildx imagetools inspect "${image}" > /dev/null 2>&1; then
            echo "${image} exists, nothing to build"
            echo "build=false" >> ${GITHUB_OUTPUT}
          else
            echo "build=true" >> ${GITHUB_OUTPUT}
          fi

      - name: Pairing server release
        id: pairing
        env:
          REBUILD: ${{ inputs.rebuild }}
        run: |
          # the QR code pairing server (channelserver), also amd64 only upstream
          version=$(git ls-remote --tags "https://github.com/${PAIRING_REPOSITORY}" | awk -F/ '{print $NF}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Pairing server release: ${version}"
          echo "version=${version}" >> ${GITHUB_OUTPUT}
          image="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-${version}"
          if [ "${REBUILD}" != true ] && docker buildx imagetools inspect "${image}" > /dev/null 2>&1; then
            echo "${image} exists, nothing to build"
            echo "build=false" >> ${GITHUB_OUTPUT}
          else
            echo "build=true" >> ${GITHUB_OUTPUT}
          fi

  build-pairing:
    needs: prepare
    if: needs.prepare.outputs.build_pairing == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout the pairing server ${{ needs.prepare.outputs.pairing_version }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PAIRING_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.pairing_version }}

      - name: Version of the pairing server
        env:
          PAIRING_VERSION: ${{ needs.prepare.outputs.pairing_version }}
        run: |
          # upstream's CI fills version.json (served at /__version__), it says TBD otherwise
          printf '{"version":"%s","commit":"%s","source":"https://github.com/%s","build":"%s/%s/actions/runs/%s"}\n' \
            "${PAIRING_VERSION}" "$(git rev-parse HEAD)" "${{ env.PAIRING_REPOSITORY }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" | tee version.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-${{ needs.prepare.outputs.pairing_version }}-linux-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.PAIRING_REPOSITORY }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.pairing_version }}
            org.opencontainers.image.licenses=MPL-2.0

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout Mozilla accounts ${{ needs.prepare.outputs.version }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FXA_REPOSITORY }}
          ref: ${{ needs.prepare.outputs.version }}

      - name: Prepare the sources like upstream's docker workflow
        run: |
          ./_scripts/l10n/clone.sh
          # version.json as upstream writes it, pointing to the upstream release
          printf '{"version":{"hash":"%s","version":"%s","source":"https://github.com/%s","build":"%s/%s/actions/runs/%s"}}\n' \
            "$(git rev-parse HEAD)" "${{ needs.prepare.outputs.version }}" "${{ env.FXA_REPOSITORY }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            | tee packages/version.json apps/version.json

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: _dev/docker/mono/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-mono-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.FXA_REPOSITORY }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MPL-2.0

  test:
    needs: [prepare, build, build-pairing]
    # runs when anything was built (a skipped build means the image already exists)
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Init images from this commit
        # the admin UI of this commit needs the procedures and grants of its init scripts: the
        # published init images may be older (the syncstorage-rs workflow rebuilds them)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: End-to-end tests with our ${{ matrix.arch }} image
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          # the init images above (the others are pulled when missing)
          SKIP_PULL: 1
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_VERSION: fxa-mono-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          FXA_ARCH: ${{ matrix.arch }}
          FXA_PAIRING_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-${{ needs.prepare.outputs.pairing_version }}-linux-${{ matrix.arch }}
        run: ./tests/e2e-fxa.sh

  # the candidate with the accounts database on MariaDB (FXA_DB=mariadb, FXA.md). Not needed
  # by publish: Mozilla supports MySQL only, a release that breaks MariaDB must not hold back
  # MySQL installs. The failed run is the warning for MariaDB installs (FXA.md: pin FXA_VERSION)
  test-mariadb:
    needs: [prepare, build, build-pairing]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Init images from this commit
        # the admin UI of this commit needs the procedures and grants of its init scripts: the
        # published init images may be older (the syncstorage-rs workflow rebuilds them)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: End-to-end tests with our amd64 image, the accounts on MariaDB
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          SKIP_PULL: 1
          FXA_DB: mariadb
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_VERSION: fxa-mono-${{ needs.prepare.outputs.version }}-linux-amd64
          FXA_ARCH: amd64
          FXA_PAIRING_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver-${{ needs.prepare.outputs.pairing_version }}-linux-amd64
        run: ./tests/e2e-fxa.sh

  # an install of the published release (fxa-mono-latest, not moved yet) with an account,
  # a device and Sync data, upgraded in place to the candidate as FXA.md says
  test-upgrade:
    needs: [prepare, build, build-pairing]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        # two accounts images of 5 GB
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Init images from this commit
        # the admin UI of this commit needs the procedures and grants of its init scripts: the
        # published init images may be older (the syncstorage-rs workflow rebuilds them)
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          docker build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          docker build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: Upgrade from the published release to our amd64 image
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          # the init images above; the accounts images are pulled, and the upgrade's own
          # docker compose pull runs anyway
          SKIP_PULL: 1
          FXA_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          FXA_VERSION: fxa-mono-${{ needs.prepare.outputs.version }}-linux-amd64
          FXA_ARCH: amd64
        run: |
          from="${REPOSITORY}:fxa-mono-latest"
          # the first release published here has nothing to upgrade from
          if ! docker buildx imagetools inspect "${from}" > /dev/null 2>&1; then
            echo "no ${from} yet, nothing to upgrade"
            exit 0
          fi
          # a rebuild of an older release (workflow_dispatch) would be a downgrade
          docker pull -q --platform linux/amd64 "${from}" > /dev/null
          published=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "${from}")
          candidate="${{ needs.prepare.outputs.version }}"
          if [ "${published}" != "${candidate}" ] && [ "$(printf '%s\n' "${published}" "${candidate}" | sort -V | tail -n 1)" = "${published}" ]; then
            echo "${from} is ${published}, newer than ${candidate}: nothing to upgrade"
            exit 0
          fi
          FXA_FROM="${from}" ./tests/fxa-upgrade.sh

  # the candidate under rootless podman too: quadlets with the accounts, set up by
  # prepare_environment.sh like a user would (and compose on the Podman socket)
  test-podman:
    needs: [prepare, build, build-pairing]
    if: ${{ !failure() && !cancelled() && (needs.prepare.outputs.build == 'true' || needs.prepare.outputs.build_pairing == 'true') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # compose (MariaDB, PostgreSQL), quadlets, then the 5 GB accounts image and its
    # quadlets (up to 20 minutes to start)
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        # rootless podman keeps its images in the home directory, on the root disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /

      - name: Set up rootless podman and a systemd user session
        run: |
          # not on every runner image
          command -v podman > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q podman; }
          sudo loginctl enable-linger "${USER}"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "${GITHUB_ENV}"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        # docker compose sends the docker CLI credentials to the Podman socket when pulling
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${TOKEN}" | podman login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin
          echo "${TOKEN}" | docker login "${REPOSITORY_REGISTRY}" -u "${OWNER}" --password-stdin

      - name: Init images from this commit
        # see the test job; podman has its own image store
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
        run: |
          podman build -q -t "${REPOSITORY}:syncstorage-rs-mysql-init-latest" db/mysql/init
          podman build -q -t "${REPOSITORY}:syncstorage-rs-postgres-init-latest" db/postgres/init

      - name: Podman tests with our ${{ matrix.arch }} image
        env:
          REPOSITORY: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}
          TAG: latest
          FXA_TEST_IMAGE: ${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-mono-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
        run: ./tests/podman.sh

  publish:
    needs: [prepare, test, test-podman, test-upgrade]
    if: ${{ !failure() && !cancelled() && needs.test.result == 'success' && needs.test-podman.result == 'success' && needs.test-upgrade.result == 'success' }}
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Multi-arch tags
        run: |
          prefix="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-mono"
          version="${{ needs.prepare.outputs.version }}"
          docker buildx imagetools create -t "${prefix}-${version}" -t "${prefix}-latest" \
            "${prefix}-${version}-linux-amd64" "${prefix}-${version}-linux-arm64"
          docker buildx imagetools inspect "${prefix}-${version}"
          pairing="${{ env.REPOSITORY_REGISTRY }}/${{ env.REPOSITORY_FULL_NAME }}:fxa-channelserver"
          pairing_version="${{ needs.prepare.outputs.pairing_version }}"
          docker buildx imagetools create -t "${pairing}-${pairing_version}" -t "${pairing}-latest" \
            "${pairing}-${pairing_version}-linux-amd64" "${pairing}-${pairing_version}-linux-arm64"
