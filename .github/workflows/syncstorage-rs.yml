name: syncstorage-rs-mysql

on:
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * 1'
  push:
    branches:
      - main
    paths:
      - '*-init/**'
      - '.github/workflows/**'

env:
  # generic variables
  REPOSITORY_SITE: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}
  SERVICE_NAME: syncstorage-rs
  SERVICE_REPOSITORY: https://github.com/mozilla-services/syncstorage-rs
  CHANGELOG_PATH: CHANGELOG.md
  IMAGE_EXPIRY: 600000 # in seconds, slightly less than a week
  IMAGE_PREFIX_TAGS: mysql-
  SERVICE_REQUIRE_INIT: true
  # specific for this component
  DATABASE_BACKEND: mysql

jobs:
  check-if-run-is-necessary:
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.determine_build.outputs.build_required }}
      latest_git_tag: ${{ steps.get_latest_tag.outputs.latest_git_tag }}

    steps:
      - name: Set workflow type (cron or push)
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "IS_CRON=true" >> ${GITHUB_ENV}
          else
            echo "IS_CRON=false" >> ${GITHUB_ENV}
          fi

      - name: Fetch latest source code tag
        id: get_latest_tag
        run: |
          latest_git_tag=$(git ls-remote --tags "${{ env.SERVICE_REPOSITORY }}" | grep -v '\^{}' | awk -F/ '{print $NF}' | sort -V | tail -n1)
          echo "Latest source code tag: ${latest_git_tag}"
          echo "latest_git_tag=${latest_git_tag}" >> ${GITHUB_OUTPUT}

      - name: Login to docker repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REPOSITORY_SITE }} -u "${{ github.actor }}" --password-stdin

      - name: Check if Docker tag exists in repository
        id: check_if_docker_tag_already_exists
        run: |
          latest_docker_tag=${{ env.SERVICE_NAME }}-${{ env.IMAGE_PREFIX_TAGS }}${{ steps.get_latest_tag.outputs.latest_git_tag }}
          echo "latest_docker_tag=${latest_docker_tag}" >> ${GITHUB_OUTPUT}
          temporary_token=$(curl "https://${{ env.REPOSITORY_SITE }}/token?scope=${{ env.REPOSITORY_FULL_NAME }}:pull" | jq -r .token)
          response=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${temporary_token}" \
            "https://${{ env.REPOSITORY_SITE }}/v2/${{ env.REPOSITORY_FULL_NAME }}/manifests/${latest_docker_tag}")
          echo "HTTP response code: ${response}"
          if [ "${response}" -eq 200 ]; then
            echo "Tag ${latest_docker_tag} exists in docker repository."
            echo "docker_tag_exists=true" >> ${GITHUB_OUTPUT}
          else
            echo "Tag ${latest_docker_tag} does not exist in docker repository."
            echo "docker_tag_exists=false" >> ${GITHUB_OUTPUT}
          fi

      - name: Check Docker image age
        id: check_image_age
        if: steps.check_if_docker_tag_already_exists.outputs.docker_tag_exists == 'true'
        run: |
          image_creation=$(docker inspect --format='{{.Created}}' ${{ env.REPOSITORY_SITE }}/${{ env.REPOSITORY_FULL_NAME }}:${steps.check_if_docker_tag_already_exists.outputs.latest_docker_tag})
          image_timestamp=$(date -d "${image_creation}" +%s)
          current_timestamp=$(date +%s)
          expiry_date=$((${current_timestamp} - ${{ env.IMAGE_EXPIRY }}))
          if [ "$image_timestamp" -lt "${expiry_date}" ]; then
            echo "Image is older than one week."
            echo "image_old=true" >> ${GITHUB_OUTPUT}
          else
            echo "Image is less than a week old."
            echo "image_old=false" >> ${GITHUB_OUTPUT}
          fi

      - name: Determine if build is required
        id: determine_build
        run: |
          if [[ "${{ env.IS_CRON }}" == "true" ]]; then
            if [[ "${{ steps.check_if_docker_tag_already_exists.outputs.docker_tag_exists }}" == "true" && "${{ steps.check_image_age.outputs.image_old }}" == "false" ]]; then
              echo "build_required=false" >> ${GITHUB_OUTPUT}
            else
              echo "build_required=true" >> ${GITHUB_OUTPUT}
            fi
          else
            echo "build_required=true" >> ${GITHUB_OUTPUT}
          fi

      - name: Skip build if not required
        if: steps.determine_build.outputs.build_required == 'false'
        run: echo "Skipping build and push steps."

  prepare-env:
    needs: check-if-run-is-necessary
    runs-on: ubuntu-latest
    if: needs.check-if-run-is-necessary.outputs.build_required == 'true'
    outputs:
      build_timestamp: ${{ steps.prepare_build_timestamp.outputs.build_timestamp }}

    steps:
      - name: Set current date/time as build timestamp
        id: prepare_build_timestamp
        run: |
          build_timestamp=$(date +'%Y%m%dT%H%M%S')
          echo "Timestamp for this build is ${build_timestamp}"
          echo "build_timestamp=${build_timestamp}" >> ${GITHUB_OUTPUT}

  build-and-push:
    needs:
      - check-if-run-is-necessary
      - prepare-env
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [linux/amd64, linux/arm64]
    permissions:
      contents: write
      packages: write
    outputs:
      service_docker_image_tags: ${{ steps.build_service_docker_image.outputs.service_docker_image_tags }}
      init_docker_image_tags: ${{ steps.build_init_docker_image.outputs.init_docker_image_tags }}
      service_generic_image_tags: ${{ steps.build_service_docker_image.outputs.service_generic_image_tags }}
      init_generic_image_tags: ${{ steps.build_init_docker_image.outputs.init_generic_image_tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone third-party repository at the latest tag
        run: |
          mkdir mozilla-services
          git clone --depth 1 --branch ${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }} "${{ env.SERVICE_REPOSITORY }}" mozilla-services/"${{ env.SERVICE_NAME }}"

      - name: Login to docker repository
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REPOSITORY_SITE }} -u "${{ github.actor }}" --password-stdin

      - name: Set up Docker Buildx
        run: docker buildx create --use

      # non-amd64 is not natively supported, see https://github.com/mozilla-services/syncstorage-rs/pull/1635
      # - name: Replace MySQL client with MariaDB client where architecture is not supported
      #   if: matrix.architecture != 'linux/amd64'
      #   run: |
      #     sed -i 's/libmysqlclient-dev/libmariadb-dev-compat libmariadb-dev/g' "./mozilla-services/${{ env.SERVICE_NAME }}/Dockerfile"

      - name: Replace Dockerfile
        run: |
          cp "./${{ env.SERVICE_NAME }}/Dockerfile" "./mozilla-services/${{ env.SERVICE_NAME }}/Dockerfile"

      - name: Build service Docker image for ${{ matrix.architecture }}
        id: build_service_docker_image
        run: |
          architecture_tag=$(echo ${{ matrix.architecture }} | sed 's/\//_/g')
          service_docker_image_tag_prefix="${{ env.REPOSITORY_SITE }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.SERVICE_NAME }}-${{ env.IMAGE_PREFIX_TAGS }}"
          service_docker_image_tag_suffix="-${architecture_tag}"
          service_docker_tag_with_timestamp="${service_docker_image_tag_prefix}-${{ needs.prepare-env.outputs.build_timestamp }}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}-${service_docker_image_tag_suffix}"
          service_docker_tag_with_version_tag="${service_docker_image_tag_prefix}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}-${service_docker_image_tag_suffix}"
          service_docker_tag_with_latest="${service_docker_image_tag_prefix}-latest-${service_docker_image_tag_suffix}"
          docker buildx build --provenance=false --platform ${{ matrix.architecture }} \
            --build-arg BUILDPLATFORM=linux/amd64 \
            --build-arg TARGETPLATFORM=${{ matrix.architecture }} \
            --build-arg DATABASE_BACKEND=${{ env.DATABASE_BACKEND }} \
            -t service_docker_tag_with_timestamp \
            -t service_docker_tag_with_version_tag \
            -t service_docker_tag_with_latest \
            --push "./mozilla-services/${{ env.SERVICE_NAME }}"

          # Platform-independent tags (generic tags)
          service_generic_tag_with_timestamp="${service_docker_image_tag_prefix}-${{ needs.prepare-env.outputs.build_timestamp }}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}"
          service_generic_tag_with_version_tag="${service_docker_image_tag_prefix}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}"
          service_generic_tag_with_latest="${service_docker_image_tag_prefix}-latest"

          echo "service_docker_image_tags=${service_docker_tag_with_timestamp},${service_docker_tag_with_version_tag},${service_docker_tag_with_latest}" >> ${GITHUB_OUTPUT}
          echo "service_generic_image_tags=${service_generic_tag_with_timestamp},${service_generic_tag_with_version_tag},${service_generic_tag_with_latest}" >> ${GITHUB_OUTPUT}

      - name: Build init Docker image for ${{ matrix.architecture }}
        id: build_init_docker_image
        run: |
          init_image_tag="${{ env.REPOSITORY_SITE }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.IMAGE_PREFIX_TAGS }}init-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}-${{ matrix.architecture }}"
          docker buildx build --platform ${{ matrix.architecture }} \
            --build-arg BUILDPLATFORM=linux/amd64 \
            --build-arg TARGETPLATFORM=${{ matrix.architecture }} \
            -t $init_image_tag \
            --push "./mozilla-services/${{ env.SERVICE_NAME }}-init"

          # Platform-independent init image
          init_generic_image_tag="${{ env.REPOSITORY_SITE }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.IMAGE_PREFIX_TAGS }}init"
          docker buildx build --platform ${{ matrix.architecture }} \
            --build-arg BUILDPLATFORM=linux/amd64 \
            --build-arg TARGETPLATFORM=linux/amd64 \
            -t $init_generic_image_tag \
            --push "./mozilla-services/${{ env.SERVICE_NAME }}-init"

          echo "init_docker_image_tags=${init_image_tag}" >> ${GITHUB_OUTPUT}
          echo "init_generic_image_tags=${init_generic_image_tag}" >> ${GITHUB_OUTPUT}

  prepare-release:
    needs:
      - prepare-env
      - build-and-push
      - check-if-run-is-necessary
    runs-on: ubuntu-latest
    if: needs.build-and-push.outputs.service_docker_image_tags != '' && needs.build-and-push.outputs.init_docker_image_tags != ''
    steps:
      - name: Collect tags
        id: collect_tags
        run: |
          service_docker_image_tags="${{ needs.build-and-push.outputs.service_docker_image_tags }}"
          service_generic_image_tags="${{ needs.build-and-push.outputs.service_generic_image_tags }}"
          init_docker_image_tags="${{ needs.build-and-push.outputs.init_docker_image_tags }}"
          init_generic_image_tags="${{ needs.build-and-push.outputs.init_generic_image_tags }}"

          echo "::set-output name=service_docker_image_tags::${service_docker_image_tags}"
          echo "::set-output name=service_generic_image_tags::${service_generic_image_tags}"
          echo "::set-output name=init_docker_image_tags::${init_docker_image_tags}"
          echo "::set-output name=init_generic_image_tags::${init_generic_image_tags}"

      - name: Create manifest for service images
        run: |
          service_manifest_tags="${{ env.REPOSITORY_SITE }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.SERVICE_NAME }}-${{ env.IMAGE_PREFIX_TAGS }}${{ needs.prepare-env.outputs.build_timestamp }}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}"

          for tag in ${{ steps.collect_tags.outputs.service_docker_image_tags }}; do
            service_manifest_tags="${service_manifest_tags},${tag}"
          done

          for tag in ${{ steps.collect_tags.outputs.service_generic_image_tags }}; do
            service_manifest_tags="${service_manifest_tags},${tag}"
          done

          docker manifest create $service_manifest_tags
          docker manifest push $service_manifest_tags

      - name: Create manifest for init images
        run: |
          init_manifest_tags="${{ env.REPOSITORY_SITE }}/${{ env.REPOSITORY_FULL_NAME }}:${{ env.IMAGE_PREFIX_TAGS }}init-${{ needs.prepare-env.outputs.build_timestamp }}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}"

          for tag in ${{ steps.collect_tags.outputs.init_docker_image_tags }}; do
            init_manifest_tags="${init_manifest_tags},${tag}"
          done

          for tag in ${{ steps.collect_tags.outputs.init_generic_image_tags }}; do
            init_manifest_tags="${init_manifest_tags},${tag}"
          done

          docker manifest create $init_manifest_tags
          docker manifest push $init_manifest_tags

      - name: Get changelog from service
        run: |
          mkdir -p mozilla-services/${{ env.SERVICE_NAME }}
          curl -H 'Accept: application/vnd.github.v3.raw' -L -s https://github.com/mozilla-services/syncstorage-rs/raw/refs/tags/0.18.1/CHANGELOG.md -o mozilla-services/${{ env.SERVICE_NAME }}/${{ env.CHANGELOG_PATH }}

      - name: Prepare changelog
        run: |
          sed -i -n '/<a name="${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}"/,/^<a name=/ {/^<a name=/!p; /^<a name="${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}"/p}' "./mozilla-services/${{ env.SERVICE_NAME }}/${{ env.CHANGELOG_PATH }}"
          sed "2s/$/ - Built on ${{ needs.prepare-env.outputs.build_timestamp }}/" -i "./mozilla-services/${{ env.SERVICE_NAME }}/${{ env.CHANGELOG_PATH }}"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.SERVICE_NAME }}
          tag: ${{ env.SERVICE_NAME }}-${{ env.IMAGE_PREFIX_TAGS }}${{ needs.prepare-env.outputs.build_timestamp }}-${{ needs.check-if-run-is-necessary.outputs.latest_git_tag }}
          bodyFile: ./mozilla-services/${{ env.SERVICE_NAME }}/${{ env.CHANGELOG_PATH }}
