name: helm

# The Helm chart (charts/firefox-sync): lint, parity with compose, and an install on a
# throwaway kind cluster per database backend, on its own database server too (tests/helm.sh).
# The init and admin images are built from this commit (tests/helm.sh does it, and kind loads
# them), the syncstorage images are this repository's published ones.
# Publishing: on a tag chart-v<version> (the version of Chart.yaml), after every test passed,
# the chart is pushed to oci://ghcr.io/<owner>/<repository>/charts/firefox-sync, lowercase: a
# package of this repository's own, which no other repository (the dev one) shares, next to
# its images (not oci://ghcr.io/<owner>/<repository>: that is the image package). The job
# version checks the tag first (.github/scripts/chart-version.sh): a stable version only from
# a commit of the default branch; a pre-release (x.y.z-<suffix>, e.g. 0.1.0-dev.1) from any
# branch, to test the publishing (helm install without --version or --devel never picks a
# pre-release). A version is published once: never replaced. Chart.yaml's annotation
# org.firefox-sync/chart is set to this address (the admin UI's helm commands show it).
# Branch pushes and the weekly run build and test only.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1' # every Monday, after the syncstorage-rs and fxa-mono builds
  push:
    branches:
      - '**'
    # (path filters do not apply to tags: a chart-v tag always runs)
    tags:
      - 'chart-v*'
    paths:
      - charts/**
      - tests/helm*
      - tests/helm/**
      - tests/test_client_flow.py
      - tests/docker-compose.admin-build.yml
      - docker-compose*.yml
      - db/**
      - config/backup/**
      - admin/**
      - .github/workflows/helm.yml
      - .github/scripts/chart-version.sh
      - .github/scripts/chart-unpublished.sh

# one run at a time per branch (and tag): a branch never cancels or waits for main's runs
concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REPOSITORY_REGISTRY: ghcr.io
  REPOSITORY_FULL_NAME: ${{ github.repository }}
  CHART_DIR: charts/firefox-sync
  HELM_VERSION: v3.22.1
  KIND_VERSION: v0.33.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  ## the version of Chart.yaml; on a chart-v tag, a mistyped or misplaced tag fails here, first ##
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # the default branch's history: is the tagged commit on it
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/chart-v') && '0' || '1' }}

      - name: The tag is chart-v and Chart.yaml's version, stable ones from the default branch
        id: version
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/chart-v') && github.ref_name || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -n "${TAG}" ]]; then
            .github/scripts/chart-version.sh "${CHART_DIR}" "${TAG}" "origin/${DEFAULT_BRANCH}" > version.txt
          else
            .github/scripts/chart-version.sh "${CHART_DIR}" > version.txt
          fi
          cat version.txt >> "${GITHUB_OUTPUT}"
          cat version.txt

  ## ct lint, kubeconform, tests/helm.sh lint (its template checks, then parity with compose) ##
  lint:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
        with:
          version: 3.15.0
          yamllint_version: 1.33.0
          yamale_version: 6.0.0

      - name: Install kubeconform and PyYAML
        # (python3 is now the venv of chart-testing, VIRTUAL_ENV: PyYAML for tests/helm.sh in it)
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf /tmp/kubeconform.tar.gz -C "${RUNNER_TEMP}/bin" kubeconform
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          uv pip install pyyaml==6.0.3
          python3 -I -c 'import yaml'
          docker compose version

      - name: ct lint
        # the version is checked when publishing (a run on main would compare the chart with
        # itself); the maintainers are not GitHub user names
        run: ct lint --charts "${CHART_DIR}" --check-version-increment=false --validate-maintainers=false

      - name: kubeconform (ci/*.yaml)
        run: |
          for values in "${CHART_DIR}"/ci/*.yaml; do
            echo "== ${values}"
            helm template test-release "${CHART_DIR}" -f "${values}" | kubeconform -strict -summary -kubernetes-version 1.29.0
          done

      - name: tests/helm.sh lint (and parity)
        run: ./tests/helm.sh lint

  ## the chart on kind: mock FxA, a Firefox client's flow, upgrades, backups, the admin UI ##
  e2e:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # this repository's syncstorage images (private ones too)
      packages: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [mariadb, mysql, postgres]
        # 1: on a database server of its own in the cluster (database.bundled=false)
        external_db: ["", "1"]
        exclude:
          # (EXTERNAL_DB=1: MySQL lts or PostgreSQL latest, as tests/e2e.sh)
          - backend: mariadb
            external_db: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kind and kubectl
        # (tests/helm.sh creates and deletes its cluster)
        uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REPOSITORY_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable the runner's AppArmor profile of MySQL
        # the runner's own MySQL server's profile (/usr/sbin/mysqld) would also confine the
        # mysqld of the mysql image in kind, whose pods run unconfined: no /etc/my.cnf, no
        # init file, the first start aborts (tests/helm.sh fails early while it is enabled)
        if: matrix.backend == 'mysql'
        run: |
          if [[ -e /etc/apparmor.d/usr.sbin.mysqld ]]; then
            sudo ln -sf /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || true
          fi
          sudo grep mysqld /sys/kernel/security/apparmor/profiles && exit 1 || echo "no mysqld profile loaded"

      - name: End-to-end on kind (${{ matrix.backend }}${{ matrix.external_db && ', your own database server' || '' }})
        # the init image (db/<engine>/init) and the admin UI (admin/) are built from this
        # commit on every run (whatever changed) and kind-loaded by tests/helm.sh; the
        # syncstorage image is REPOSITORY's, pulled here and imported into the cluster
        env:
          TAG: latest
          BACKEND: ${{ matrix.backend }}
          EXTERNAL_DB: ${{ matrix.external_db }}
        # (an image reference is lowercase)
        run: REPOSITORY="${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME,,}" ./tests/helm.sh e2e "${BACKEND}"

  ## oci://ghcr.io/<owner>/<repository>/charts/firefox-sync:<version>, on chart-v<version> tags ##
  publish:
    needs: [version, lint, e2e]
    if: startsWith(github.ref, 'refs/tags/chart-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        # by commit (v5.0.1), in this job alone: it runs with packages: write, a moved tag
        # of a third-party action must not reach the token that publishes (the other jobs
        # keep the tags, as the repository's other workflows)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Where the chart is published
        # Chart.yaml's annotation (the public repository's in the tree), which the admin UI's
        # helm upgrade commands show (ADMIN_K8S_CHART): this repository's
        run: |
          chart="oci://${REPOSITORY_REGISTRY}/${REPOSITORY_FULL_NAME,,}/charts"
          echo "CHART_REGISTRY=${chart}" >> "${GITHUB_ENV}"
          sed -i "s|^  org.firefox-sync/chart: .*|  org.firefox-sync/chart: ${chart}/firefox-sync|" "${CHART_DIR}/Chart.yaml"
          helm show chart "${CHART_DIR}" | grep -Fx "  org.firefox-sync/chart: ${chart}/firefox-sync"

      - name: Package
        run: helm package "${CHART_DIR}"

      - name: Push
        # a version once only: a release never changes under the same version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login "${REPOSITORY_REGISTRY}" -u "${ACTOR}" --password-stdin <<< "${TOKEN}"
          # fails closed: only the registry's clear not found lets it push
          .github/scripts/chart-unpublished.sh "${CHART_REGISTRY}/firefox-sync" "${VERSION}"
          helm push "firefox-sync-${VERSION}.tgz" "${CHART_REGISTRY}"
          helm show chart "${CHART_REGISTRY}/firefox-sync" --version "${VERSION}"
