# Test-only: the values of tests/helm-fxa.sh e2e, the self-hosted accounts on *.fxa.test
# (fxa.enabled, the images and the databases' backends are set by the script), as
# tests/docker-compose.fxa-test.yml: every public host through the test Ingress controller
# (tests/helm/traefik.yaml, class traefik) over HTTPS with the test CA (Secret fxa-test-tls,
# its CA in the ConfigMap fxa-test-ca), the email to the mail catcher (tests/helm/fxa-fixtures.yaml)
syncDomain: https://sync.fxa.test
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    secretName: fxa-test-tls
smtp:
  host: mailpit
  port: 1025
  user: ""
  sender: "Mozilla accounts <no-reply@fxa.test>"
# as tests/e2e-fxa.sh's stack: max users managed in the admin UI (SYNC_MAX_USERS=initial:10)
maxUsers: initial:10
# the admin UI (test_fxa_flow.py's reset of the Sync data, test_fxa_admin.py), signing in with
# the accounts too (ADMIN_FXA_CLIENT_ID, ADMIN_ALLOWED_USERS=@example.com), alerts to the mail
# catcher and Prometheus with the token of tests/docker-compose.fxa-test.yml (its faster
# intervals: admin_test_env of tests/helm-fxa.sh, test-only, after every helm install/upgrade)
admin:
  enabled: true
  fxaSignIn: true
  allowed:
    users: "@example.com"
  alertEmail: admin@fxa.test
  metricsToken: ffs-test-metrics-token
  ingress:
    enabled: true
    className: traefik
    host: admin.fxa.test
    tls:
      enabled: true
      secretName: fxa-test-tls
# the backups, as tests/e2e-fxa.sh's stack (COMPOSE_PROFILES=backup): both scopes
backup:
  enabled: true
fxa:
  contentUrl: https://accounts.fxa.test
  authUrl: https://api.fxa.test
  profileUrl: https://profile.fxa.test
  # tests/e2e-fxa.sh's: the sign-up allowlist, the admin UI's OAuth client, the security history
  signups: allowlist
  signupAllowlist: "@example.com,invited@example.net"
  adminClientId: ad41a7e5f0c0ffee
  accountEvents: true
  # the pairing server of tests/e2e-fxa.sh's stack (COMPOSE_PROFILES=pairing)
  pairing:
    enabled: true
    url: wss://pairing.fxa.test
  # the accounts' servers trust the test CA (compose's NODE_EXTRA_CA_CERTS=/caddy-ca/root.crt)
  extraCaCerts:
    configMap: fxa-test-ca
    key: root.crt
  ingress:
    enabled: true
    className: traefik
    tls:
      enabled: true
      secretNames:
        content: fxa-test-tls
        auth: fxa-test-tls
        profile: fxa-test-tls
        pairing: fxa-test-tls
