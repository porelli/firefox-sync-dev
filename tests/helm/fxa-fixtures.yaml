# Test-only: what tests/helm-fxa.sh e2e runs next to the chart, as tests/docker-compose.fxa-test.yml:
# the mail catcher (the verification codes the tests read) and the tests' own state between Jobs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailpit}
  template:
    metadata:
      labels: {app: mailpit}
    spec:
      containers:
        - name: mailpit
          image: docker.io/axllent/mailpit:latest
          imagePullPolicy: Never
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          # the image's own check, as compose's
          readinessProbe:
            exec:
              command: [/mailpit, readyz]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: {app: mailpit}
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fxa-test-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
