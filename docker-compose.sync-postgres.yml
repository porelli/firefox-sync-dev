# PostgreSQL variant: one PostgreSQL database shared by syncstorage and tokenserver
# Usage: docker compose -f docker-compose.sync-postgres.yml up -d
# (or set COMPOSE_FILE=docker-compose.sync-postgres.yml in .env, prepare_environment.sh does it for you)

# the old names of the Sync settings (MIGRATING.md#renamed-settings) set in .env or in the
# environment: they still work, the init container and the admin UI say they are there
x-old-env-names: &old-env-names "${MARIADB_TOKENSERVER_DATABASE:+MARIADB_TOKENSERVER_DATABASE }${MARIADB_TOKENSERVER_USER:+MARIADB_TOKENSERVER_USER }${MARIADB_TOKENSERVER_PASSWORD:+MARIADB_TOKENSERVER_PASSWORD }${MARIADB_TOKENSERVER_SERVER:+MARIADB_TOKENSERVER_SERVER }${MARIADB_TOKENSERVER_SERVER_PORT:+MARIADB_TOKENSERVER_SERVER_PORT }${MARIADB_SYNCSTORAGE_DATABASE:+MARIADB_SYNCSTORAGE_DATABASE }${MARIADB_SYNCSTORAGE_USER:+MARIADB_SYNCSTORAGE_USER }${MARIADB_SYNCSTORAGE_PASSWORD:+MARIADB_SYNCSTORAGE_PASSWORD }${MARIADB_SYNCSTORAGE_SERVER:+MARIADB_SYNCSTORAGE_SERVER }${MARIADB_SYNCSTORAGE_SERVER_PORT:+MARIADB_SYNCSTORAGE_SERVER_PORT }${POSTGRES_DATABASE:+POSTGRES_DATABASE }${POSTGRES_USER:+POSTGRES_USER }${POSTGRES_PASSWORD:+POSTGRES_PASSWORD }${POSTGRES_SERVER:+POSTGRES_SERVER }${POSTGRES_SERVER_PORT:+POSTGRES_SERVER_PORT }${POSTGRES_SYNC_USER:+POSTGRES_SYNC_USER }${POSTGRES_SYNC_PASSWORD:+POSTGRES_SYNC_PASSWORD }${POSTGRES_IMAGE:+POSTGRES_IMAGE }${MARIADB_TLS_VERIFY:+MARIADB_TLS_VERIFY }${DB_CONTAINERS:+DB_CONTAINERS }${MAX_USERS:+MAX_USERS }${CONTAINER_EXPORT_PORT:+CONTAINER_EXPORT_PORT }${SYNCSTORAGE_DOMAIN:+SYNCSTORAGE_DOMAIN }${METRICS_HASH_SECRET:+METRICS_HASH_SECRET }${REPOSITORY:+REPOSITORY }${SYNCSTORAGE_IMAGE:+SYNCSTORAGE_IMAGE }${SYNCSTORAGE_IMAGE_TAG:+SYNCSTORAGE_IMAGE_TAG }${SYNCSTORAGE_INIT_IMAGE:+SYNCSTORAGE_INIT_IMAGE }${SYNCSTORAGE_INIT_IMAGE_TAG:+SYNCSTORAGE_INIT_IMAGE_TAG }"

# the Sync settings set under both names (new/old): compose takes the new one, which is then
# often a line added from .env-example (placeholder passwords, default hosts): the
# migrations and the init container refuse to start, ./prepare_environment.sh --upgrade
# merges them (MIGRATING.md#renamed-settings)
x-both-env-names: &both-env-names "${SYNC_TOKENSERVER_DB_NAME:+${MARIADB_TOKENSERVER_DATABASE:+SYNC_TOKENSERVER_DB_NAME/MARIADB_TOKENSERVER_DATABASE }}${SYNC_TOKENSERVER_DB_USER:+${MARIADB_TOKENSERVER_USER:+SYNC_TOKENSERVER_DB_USER/MARIADB_TOKENSERVER_USER }}${SYNC_TOKENSERVER_DB_PASSWORD:+${MARIADB_TOKENSERVER_PASSWORD:+SYNC_TOKENSERVER_DB_PASSWORD/MARIADB_TOKENSERVER_PASSWORD }}${SYNC_TOKENSERVER_DB_HOST:+${MARIADB_TOKENSERVER_SERVER:+SYNC_TOKENSERVER_DB_HOST/MARIADB_TOKENSERVER_SERVER }}${SYNC_TOKENSERVER_DB_PORT:+${MARIADB_TOKENSERVER_SERVER_PORT:+SYNC_TOKENSERVER_DB_PORT/MARIADB_TOKENSERVER_SERVER_PORT }}${SYNC_STORAGE_DB_NAME:+${MARIADB_SYNCSTORAGE_DATABASE:+SYNC_STORAGE_DB_NAME/MARIADB_SYNCSTORAGE_DATABASE }}${SYNC_STORAGE_DB_USER:+${MARIADB_SYNCSTORAGE_USER:+SYNC_STORAGE_DB_USER/MARIADB_SYNCSTORAGE_USER }}${SYNC_STORAGE_DB_PASSWORD:+${MARIADB_SYNCSTORAGE_PASSWORD:+SYNC_STORAGE_DB_PASSWORD/MARIADB_SYNCSTORAGE_PASSWORD }}${SYNC_STORAGE_DB_HOST:+${MARIADB_SYNCSTORAGE_SERVER:+SYNC_STORAGE_DB_HOST/MARIADB_SYNCSTORAGE_SERVER }}${SYNC_STORAGE_DB_PORT:+${MARIADB_SYNCSTORAGE_SERVER_PORT:+SYNC_STORAGE_DB_PORT/MARIADB_SYNCSTORAGE_SERVER_PORT }}${SYNC_POSTGRES_NAME:+${POSTGRES_DATABASE:+SYNC_POSTGRES_NAME/POSTGRES_DATABASE }}${SYNC_POSTGRES_USER:+${POSTGRES_USER:+SYNC_POSTGRES_USER/POSTGRES_USER }}${SYNC_POSTGRES_PASSWORD:+${POSTGRES_PASSWORD:+SYNC_POSTGRES_PASSWORD/POSTGRES_PASSWORD }}${SYNC_POSTGRES_HOST:+${POSTGRES_SERVER:+SYNC_POSTGRES_HOST/POSTGRES_SERVER }}${SYNC_POSTGRES_PORT:+${POSTGRES_SERVER_PORT:+SYNC_POSTGRES_PORT/POSTGRES_SERVER_PORT }}${SYNC_POSTGRES_APP_USER:+${POSTGRES_SYNC_USER:+SYNC_POSTGRES_APP_USER/POSTGRES_SYNC_USER }}${SYNC_POSTGRES_APP_PASSWORD:+${POSTGRES_SYNC_PASSWORD:+SYNC_POSTGRES_APP_PASSWORD/POSTGRES_SYNC_PASSWORD }}${SYNC_POSTGRES_IMAGE:+${POSTGRES_IMAGE:+SYNC_POSTGRES_IMAGE/POSTGRES_IMAGE }}${SYNC_DB_TLS_VERIFY:+${MARIADB_TLS_VERIFY:+SYNC_DB_TLS_VERIFY/MARIADB_TLS_VERIFY }}${SYNC_DB_CONTAINERS:+${DB_CONTAINERS:+SYNC_DB_CONTAINERS/DB_CONTAINERS }}${SYNC_MAX_USERS:+${MAX_USERS:+SYNC_MAX_USERS/MAX_USERS }}${SYNC_EXPORT_PORT:+${CONTAINER_EXPORT_PORT:+SYNC_EXPORT_PORT/CONTAINER_EXPORT_PORT }}${SYNC_PUBLIC_URL:+${SYNCSTORAGE_DOMAIN:+SYNC_PUBLIC_URL/SYNCSTORAGE_DOMAIN }}${SYNC_METRICS_HASH_SECRET:+${METRICS_HASH_SECRET:+SYNC_METRICS_HASH_SECRET/METRICS_HASH_SECRET }}${IMAGE_REPOSITORY:+${REPOSITORY:+IMAGE_REPOSITORY/REPOSITORY }}${SYNC_IMAGE:+${SYNCSTORAGE_IMAGE:+SYNC_IMAGE/SYNCSTORAGE_IMAGE }}${SYNC_IMAGE_TAG:+${SYNCSTORAGE_IMAGE_TAG:+SYNC_IMAGE_TAG/SYNCSTORAGE_IMAGE_TAG }}${SYNC_INIT_IMAGE:+${SYNCSTORAGE_INIT_IMAGE:+SYNC_INIT_IMAGE/SYNCSTORAGE_INIT_IMAGE }}${SYNC_INIT_IMAGE_TAG:+${SYNCSTORAGE_INIT_IMAGE_TAG:+SYNC_INIT_IMAGE_TAG/SYNCSTORAGE_INIT_IMAGE_TAG }}"

x-syncstorage-env: &syncstorage-env
  # set under both names: the migrations stop (x-both-env-names)
  FFS_BOTH_ENV_NAMES: *both-env-names
  SYNC_HOST: 0.0.0.0
  SYNC_HUMAN_LOGS: 1
  SYNC_MASTER_SECRET: ${SYNC_MASTER_SECRET}
  # the Sync server's own role (SYNC_POSTGRES_APP_USER), which is no superuser: the init
  # container gives it the Sync tables (DATABASES.md). Without it (an install from before,
  # or your own server) SYNC_POSTGRES_USER
  SYNC_SYNCSTORAGE__DATABASE_URL: postgres://${SYNC_POSTGRES_APP_USER:-${POSTGRES_SYNC_USER:-${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}}}:${SYNC_POSTGRES_APP_PASSWORD:-${POSTGRES_SYNC_PASSWORD:-${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}}}@${SYNC_POSTGRES_HOST:-${POSTGRES_SERVER:-}}:${SYNC_POSTGRES_PORT:-${POSTGRES_SERVER_PORT:-}}/${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
  SYNC_TOKENSERVER__ENABLED: "true"
  SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
  SYNC_TOKENSERVER__NODE_TYPE: postgres
  SYNC_TOKENSERVER__DATABASE_URL: postgres://${SYNC_POSTGRES_APP_USER:-${POSTGRES_SYNC_USER:-${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}}}:${SYNC_POSTGRES_APP_PASSWORD:-${POSTGRES_SYNC_PASSWORD:-${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}}}@${SYNC_POSTGRES_HOST:-${POSTGRES_SERVER:-}}:${SYNC_POSTGRES_PORT:-${POSTGRES_SERVER_PORT:-}}/${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
  SYNC_TOKENSERVER__INIT_NODE_URL: ${SYNC_PUBLIC_URL:-${SYNCSTORAGE_DOMAIN:-}}
  SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${FXA_EMAIL_DOMAIN}
  SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: ${FXA_OAUTH_SERVER_URL}
  SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${SYNC_METRICS_HASH_SECRET:-${METRICS_HASH_SECRET:-}}
  SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: 2
  RUST_LOG: info

x-syncstorage: &syncstorage
  image: ${IMAGE_REPOSITORY:-${REPOSITORY:-}}:${SYNC_IMAGE:-${SYNCSTORAGE_IMAGE:-}}-${SYNC_IMAGE_TAG:-${SYNCSTORAGE_IMAGE_TAG:-}}
  # no raw sockets (ping, ARP or ICMP forging on the stack's network) for the Sync server
  # and its migrations, broken into or not; nothing of theirs needs them
  cap_drop: [NET_RAW]
  environment: *syncstorage-env

services:
  # Every service that keeps running has a healthcheck (`docker compose ps` shows it); the
  # one-shot ones (restart: "no": migrations, inits) have none, they are judged by their exit
  # status (service_completed_successfully)

  # the Sync server's own role (SYNC_POSTGRES_APP_USER), before the migrations: created, given
  # the Sync tables (those of a database from before it) and the right to create them. Then
  # no superuser session reads or writes a table that role owns (its triggers, rules, views
  # and functions would run as the superuser), see DATABASES.md. Without SYNC_POSTGRES_APP_USER
  # (an install from before it, or your own server) nothing
  sync_role_init:
    image: ${IMAGE_REPOSITORY:-${REPOSITORY:-}}:${SYNC_INIT_IMAGE:-${SYNCSTORAGE_INIT_IMAGE:-}}-${SYNC_INIT_IMAGE_TAG:-${SYNCSTORAGE_INIT_IMAGE_TAG:-}}
    command: [sync-role]
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: "no"
    environment:
      POSTGRES_SERVER: ${SYNC_POSTGRES_HOST:-${POSTGRES_SERVER:-}}
      POSTGRES_SERVER_PORT: ${SYNC_POSTGRES_PORT:-${POSTGRES_SERVER_PORT:-}}
      POSTGRES_DATABASE: ${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
      POSTGRES_USER: ${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}
      POSTGRES_PASSWORD: ${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}
      POSTGRES_SYNC_USER: ${SYNC_POSTGRES_APP_USER:-${POSTGRES_SYNC_USER:-}}
      POSTGRES_SYNC_PASSWORD: ${SYNC_POSTGRES_APP_PASSWORD:-${POSTGRES_SYNC_PASSWORD:-}}
      # the settings under both names: it refuses to start
      FFS_BOTH_ENV_NAMES: *both-env-names

  syncstorage_migrate:
    <<: *syncstorage
    # as the Sync server's own role (SYNC_POSTGRES_APP_USER, sync_role_init), like the Sync server
    # Runs the database migrations (and creates the sync node) without exposing
    # the service, so that SYNC_MAX_USERS is enforced before anybody can reach it
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$${FFS_BOTH_ENV_NAMES:-}" ]; then
          for p in $$FFS_BOTH_ENV_NAMES; do
            echo "ERROR: $${p%%/*} and $${p#*/} are both set (in .env or in the environment docker compose runs in): run ./prepare_environment.sh --upgrade for .env, or unset $${p#*/} in your shell (MIGRATING.md#renamed-settings)"
          done
          exit 1
        fi
        # the node the init container sets: not empty, not the placeholder of .env-example
        case "$${SYNC_TOKENSERVER__INIT_NODE_URL:-}" in
          ""|*"<REPLACE_WITH_"*) echo "ERROR: the public Sync URL (SYNC_PUBLIC_URL) is empty or still the placeholder of .env-example: set it in .env"; exit 1 ;;
        esac
        pid=
        for i in $$(seq 1 120); do
          # (re)start syncstorage-rs until the databases accept connections
          if [ -z "$$pid" ] || ! kill -0 $$pid 2> /dev/null; then
            /app/bin/syncserver &
            pid=$$!
          fi
          if curl -sf http://localhost:8000/__heartbeat__ > /dev/null; then
            # it answers once the migrations ran. Its graceful shutdown can hang for good
            # (workers that never stop): killed 30 s after SIGTERM
            kill $$pid
            (sleep 30; kill -0 $$pid 2> /dev/null && echo "syncstorage-rs still running 30 s after SIGTERM, killed" && kill -9 $$pid) &
            wait $$pid
            kill $$! 2> /dev/null
            echo "Migrations completed"
            exit 0
          fi
          sleep 1
        done
        echo "Timeout waiting for syncstorage-rs to start"
        kill $$pid
        exit 1
    restart: "no"
    depends_on:
      postgres_db:
        condition: service_healthy
      sync_role_init:
        condition: service_completed_successfully

  syncstorage:
    <<: *syncstorage
    # metrics for the admin UI, when it runs: syncstorage-rs does not start if the
    # metrics host does not resolve, so only point it there if it does
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if getent hosts ffs-admin > /dev/null; then
          export SYNC_STATSD_HOST=ffs-admin SYNC_STATSD_PORT=8125
          echo "Sending metrics to the admin UI"
        fi
        exec /app/bin/syncserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      tokenserver_db_init:
        condition: service_completed_successfully
      # started first when enabled (COMPOSE_PROFILES=admin), for the metrics; and
      # restarted with it: the metrics host is resolved once, a new container has a new IP
      ffs-admin:
        condition: service_started
        required: false
        restart: true
    ports:
      # neither set: 127.0.0.1:5000 (before: a random port on every interface)
      - ${SYNC_EXPORT_PORT:-${CONTAINER_EXPORT_PORT:-127.0.0.1:5000}}:8000

  postgres_db:
    image: ${SYNC_POSTGRES_IMAGE:-${POSTGRES_IMAGE:-postgres:18}}
    # 0: your own server (DATABASES.md); compose then skips the dependency on it
    deploy:
      replicas: ${SYNC_DB_CONTAINERS:-${DB_CONTAINERS:-1}}
    environment:
      POSTGRES_DB: ${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
      POSTGRES_USER: ${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}
      POSTGRES_PASSWORD: ${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}} -d ${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres-db:/var/lib/postgresql
    restart: unless-stopped

  tokenserver_db_init:
    image: ${IMAGE_REPOSITORY:-${REPOSITORY:-}}:${SYNC_INIT_IMAGE:-${SYNCSTORAGE_INIT_IMAGE:-}}-${SYNC_INIT_IMAGE_TAG:-${SYNCSTORAGE_INIT_IMAGE_TAG:-}}
    depends_on:
      postgres_db:
        condition: service_healthy
      syncstorage_migrate:
        condition: service_completed_successfully
    restart: "no"
    environment:
      POSTGRES_SERVER: ${SYNC_POSTGRES_HOST:-${POSTGRES_SERVER:-}}
      POSTGRES_SERVER_PORT: ${SYNC_POSTGRES_PORT:-${POSTGRES_SERVER_PORT:-}}
      POSTGRES_DATABASE: ${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
      POSTGRES_USER: ${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}
      POSTGRES_PASSWORD: ${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}
      MAX_USERS: ${SYNC_MAX_USERS:-${MAX_USERS:-}}
      DOMAIN: ${SYNC_PUBLIC_URL:-${SYNCSTORAGE_DOMAIN:-}}
      # the old setting names it got values through, for its warning
      FFS_OLD_ENV_NAMES: *old-env-names
      # the settings under both names: it refuses to start
      FFS_BOTH_ENV_NAMES: *both-env-names
      # the Sync server's own role, created here and given the Sync tables when SYNC_POSTGRES_USER
      # is a superuser (the database container), see DATABASES.md
      POSTGRES_SYNC_USER: ${SYNC_POSTGRES_APP_USER:-${POSTGRES_SYNC_USER:-}}
      POSTGRES_SYNC_PASSWORD: ${SYNC_POSTGRES_APP_PASSWORD:-${POSTGRES_SYNC_PASSWORD:-}}
      # the admin UI's roles and database: created here when SYNC_POSTGRES_USER is a superuser
      # (the database container), by database-setup.sql on your own server; the reader of
      # the Sync data given its grants on the Sync tables (DATABASES.md)
      ADMIN_DB_USER: ${ADMIN_DB_USER:-ffs_admin_ui}
      ADMIN_DB_SYNC_USER: ${ADMIN_DB_SYNC_USER:-ffs_admin_sync}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-ffs_admin}

  # optional admin UI (COMPOSE_PROFILES=admin), see ADMIN.md
  ffs-admin:
    image: ${ADMIN_IMAGE:-${IMAGE_REPOSITORY:-${REPOSITORY:-}}:admin-latest}
    profiles: [admin]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # initial:N: the admin UI manages max users, otherwise .env does (read-only)
      MAX_USERS: ${SYNC_MAX_USERS:-${MAX_USERS:-}}
      # its own roles and database, out of the Sync server's reach (DATABASES.md): one for
      # its database, one that reads the Sync data. Without ADMIN_DB_PASSWORD (an install
      # from before it) the Sync server's role (never the superuser SYNC_POSTGRES_USER when there
      # is one), and its tables in the Sync database: only then does TOKENSERVER_DB_PASSWORD
      # get its password
      ADMIN_DB_USER: ${ADMIN_DB_USER:-ffs_admin_ui}
      ADMIN_DB_SYNC_USER: ${ADMIN_DB_SYNC_USER:-ffs_admin_sync}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-ffs_admin}
      TOKENSERVER_DB_TYPE: postgres
      TOKENSERVER_DB_HOST: ${SYNC_POSTGRES_HOST:-${POSTGRES_SERVER:-}}
      TOKENSERVER_DB_PORT: ${SYNC_POSTGRES_PORT:-${POSTGRES_SERVER_PORT:-}}
      TOKENSERVER_DB_NAME: ${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
      TOKENSERVER_DB_USER: ${SYNC_POSTGRES_APP_USER:-${POSTGRES_SYNC_USER:-${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}}}
      TOKENSERVER_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-${SYNC_POSTGRES_APP_PASSWORD:-${POSTGRES_SYNC_PASSWORD:-${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}}}}
      SYNCSTORAGE_URL: http://syncstorage:8000
      # the setup checks: the Sync node, the keys of the sign-ins, the accounts' email domain
      SYNCSTORAGE_DOMAIN: ${SYNC_PUBLIC_URL:-${SYNCSTORAGE_DOMAIN:-}}
      # the old setting names of .env, for a setup check
      FFS_OLD_ENV_NAMES: *old-env-names
      FXA_OAUTH_SERVER_URL: ${FXA_OAUTH_SERVER_URL:-}
      FXA_EMAIL_DOMAIN: ${FXA_EMAIL_DOMAIN:-}
      # every hour the public https URLs, their certificates (and the sign-up gate); false: never
      ADMIN_PUBLIC_CHECK: ${ADMIN_PUBLIC_CHECK:-true}
      ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      # alerts also to Slack, Discord, Teams, ntfy, Gotify, Telegram, Matrix or a webhook (ADMIN.md#alerts)
      ADMIN_NOTIFY: ${ADMIN_NOTIFY:-}
      SMTP_HOST: ${FXA_SMTP_HOST:-}
      SMTP_PORT: ${FXA_SMTP_PORT:-587}
      SMTP_USER: ${FXA_SMTP_USER:-}
      SMTP_PASS: ${FXA_SMTP_PASS:-}
      SMTP_SECURE: ${FXA_SMTP_SECURE:-false}
      SMTP_SENDER: ${FXA_SMTP_SENDER:-}
      METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:-}
      ADMIN_UPDATE_CHECK: ${ADMIN_UPDATE_CHECK:-true}
      ADMIN_STALE_DAYS: ${ADMIN_STALE_DAYS:-90}
      ADMIN_RETENTION_DAYS: ${ADMIN_RETENTION_DAYS:-30}
      ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-365}
      # the alerts on a spike of Sync errors and on the growth of the databases (ADMIN.md)
      ADMIN_ERROR_RATE_PERCENT: ${ADMIN_ERROR_RATE_PERCENT:-10}
      ADMIN_ERROR_RATE_MIN_ERRORS: ${ADMIN_ERROR_RATE_MIN_ERRORS:-20}
      ADMIN_DB_GROWTH_MB: ${ADMIN_DB_GROWTH_MB:-1024}
      ADMIN_DB_GROWTH_FACTOR: ${ADMIN_DB_GROWTH_FACTOR:-5}
      # the daily purge of the Sync storage, the old unconfirmed accounts, sign-up bursts (ADMIN.md)
      ADMIN_PURGE: ${ADMIN_PURGE:-}
      ADMIN_DELETE_UNCONFIRMED_DAYS: ${ADMIN_DELETE_UNCONFIRMED_DAYS:-}
      ADMIN_SIGNUP_BURST: ${ADMIN_SIGNUP_BURST:-10}
      # times of the pages and the alerts, e.g. Europe/Rome (default UTC)
      ADMIN_TZ: ${ADMIN_TZ:-}
      # what the backup service does (COMPOSE_PROFILES=backup), for its help on the overview
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # the commands it shows: compose's (the Quadlets say quadlets)
      ADMIN_DEPLOYMENT: compose
      # the configuration page (no secrets): the databases, where the admin UI is published
      ADMIN_EXPORT_PORT: ${ADMIN_EXPORT_PORT:-127.0.0.1:8090}
      # sign-in (see ADMIN.md): ADMIN_PASSWORD, OpenID Connect and/or a trusted proxy's header
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-}
      ADMIN_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-}
      ADMIN_OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-}
      ADMIN_OIDC_REDIRECT_URL: ${ADMIN_OIDC_REDIRECT_URL:-}
      ADMIN_OIDC_SCOPES: ${ADMIN_OIDC_SCOPES:-}
      ADMIN_OIDC_NAME: ${ADMIN_OIDC_NAME:-}
      ADMIN_OIDC_GROUPS_CLAIM: ${ADMIN_OIDC_GROUPS_CLAIM:-}
      ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL: ${ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL:-}
      ADMIN_AUTH_HEADER: ${ADMIN_AUTH_HEADER:-}
      ADMIN_AUTH_GROUPS_HEADER: ${ADMIN_AUTH_GROUPS_HEADER:-}
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-}
      ADMIN_ALLOWED_USERS: ${ADMIN_ALLOWED_USERS:-}
      ADMIN_ALLOWED_GROUPS: ${ADMIN_ALLOWED_GROUPS:-}
    # the image's own check (its HEALTHCHECK), explicit here and in the Quadlets: /healthz
    # of the admin UI; no shell in the image, the exec form
    healthcheck:
      test: ["CMD", "/ffs-admin", "healthcheck"]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      tokenserver_db_init:
        condition: service_completed_successfully
    ports:
      - ${ADMIN_EXPORT_PORT:-127.0.0.1:8090}:8080
    restart: unless-stopped

  # optional nightly backups (COMPOSE_PROFILES=backup) of the database into the backups
  # volume, see ADMIN.md#backups. Run one now: docker compose exec backup sh /ffs-backup/backup.sh now
  backup:
    image: ${SYNC_POSTGRES_IMAGE:-${POSTGRES_IMAGE:-postgres:18}}
    profiles: [backup]
    entrypoint: [sh, /ffs-backup/backup.sh]
    command: [loop]
    environment:
      BACKUP_SCOPE: sync
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      TOKENSERVER_DB_TYPE: postgres
      TOKENSERVER_DB_HOST: ${SYNC_POSTGRES_HOST:-${POSTGRES_SERVER:-}}
      TOKENSERVER_DB_PORT: ${SYNC_POSTGRES_PORT:-${POSTGRES_SERVER_PORT:-}}
      TOKENSERVER_DB_NAME: ${SYNC_POSTGRES_NAME:-${POSTGRES_DATABASE:-}}
      # as the Sync server's own role, the owner of every table (ADMIN.md#restoring loads the
      # dump as it too); without SYNC_POSTGRES_APP_USER SYNC_POSTGRES_USER
      TOKENSERVER_DB_USER: ${SYNC_POSTGRES_APP_USER:-${POSTGRES_SYNC_USER:-${SYNC_POSTGRES_USER:-${POSTGRES_USER:-}}}}
      TOKENSERVER_DB_PASSWORD: ${SYNC_POSTGRES_APP_PASSWORD:-${POSTGRES_SYNC_PASSWORD:-${SYNC_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}}}
      # the admin UI's database: dumped too, and where the runs are recorded
      ADMIN_DB_USER: ${ADMIN_DB_USER:-ffs_admin_ui}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-ffs_admin}
    # the loop goes round every minute: unhealthy when it stops, when the last run failed or
    # when the last good one is over 25 h old (backup.sh health); a run going on is fine
    healthcheck:
      test: ["CMD", "sh", "/ffs-backup/backup.sh", "health"]
      start_period: 1m
      interval: 1m
      timeout: 10s
      retries: 2
    volumes:
      - ./config/backup:/ffs-backup:ro
      - backups:/backups
    depends_on:
      tokenserver_db_init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-db:
  backups:
