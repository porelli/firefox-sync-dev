x-syncstorage: &syncstorage
  image: ${REPOSITORY}:${SYNCSTORAGE_IMAGE}-${SYNCSTORAGE_IMAGE_TAG}
  # no raw sockets (ping, ARP or ICMP forging on the stack's network) for the Sync server
  # and its migrations, broken into or not; nothing of theirs needs them
  cap_drop: [NET_RAW]
  environment:
    SYNC_HOST: 0.0.0.0
    SYNC_HUMAN_LOGS: 1
    SYNC_MASTER_SECRET: ${SYNC_MASTER_SECRET}
    SYNC_SYNCSTORAGE__DATABASE_URL: mysql://${MARIADB_SYNCSTORAGE_USER}:${MARIADB_SYNCSTORAGE_PASSWORD}@${MARIADB_SYNCSTORAGE_SERVER}:${MARIADB_SYNCSTORAGE_SERVER_PORT}/${MARIADB_SYNCSTORAGE_DATABASE}
    SYNC_TOKENSERVER__ENABLED: "true"
    SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
    SYNC_TOKENSERVER__NODE_TYPE: mysql
    SYNC_TOKENSERVER__DATABASE_URL: mysql://${MARIADB_TOKENSERVER_USER}:${MARIADB_TOKENSERVER_PASSWORD}@${MARIADB_TOKENSERVER_SERVER}:${MARIADB_TOKENSERVER_SERVER_PORT}/${MARIADB_TOKENSERVER_DATABASE}
    SYNC_TOKENSERVER__INIT_NODE_URL: ${SYNCSTORAGE_DOMAIN}
    SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: ${FXA_EMAIL_DOMAIN}
    SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: ${FXA_OAUTH_SERVER_URL}
    SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: ${METRICS_HASH_SECRET}
    SYNC_TOKENSERVER__ADDITIONAL_BLOCKING_THREADS_FOR_FXA_REQUESTS: 2
    RUST_LOG: info

services:
  syncstorage_migrate:
    <<: *syncstorage
    # Runs the database migrations (and creates the sync node) without exposing
    # the service, so that MAX_USERS is enforced before anybody can reach it
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pid=
        for i in $$(seq 1 120); do
          # (re)start syncstorage-rs until the databases accept connections
          if [ -z "$$pid" ] || ! kill -0 $$pid 2> /dev/null; then
            /app/bin/syncserver &
            pid=$$!
          fi
          if curl -sf http://localhost:8000/__heartbeat__ > /dev/null; then
            kill $$pid; wait $$pid
            echo "Migrations completed"
            exit 0
          fi
          sleep 1
        done
        echo "Timeout waiting for syncstorage-rs to start"
        kill $$pid
        exit 1
    restart: "no"
    depends_on:
      syncstorage_db:
        condition: service_healthy
      tokenserver_db:
        condition: service_healthy

  syncstorage:
    <<: *syncstorage
    # metrics for the admin UI, when it runs: syncstorage-rs does not start if the
    # metrics host does not resolve, so only point it there if it does
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if getent hosts ffs-admin > /dev/null; then
          export SYNC_STATSD_HOST=ffs-admin SYNC_STATSD_PORT=8125
          echo "Sending metrics to the admin UI"
        fi
        exec /app/bin/syncserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/__heartbeat__"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      tokenserver_db_init:
        condition: service_completed_successfully
      # started first when enabled (COMPOSE_PROFILES=admin), for the metrics; and
      # restarted with it: the metrics host is resolved once, a new container has a new IP
      ffs-admin:
        condition: service_started
        required: false
        restart: true
    ports:
      - ${CONTAINER_EXPORT_PORT}:8000

  syncstorage_db:
    image: mariadb:lts
    # 0: your own server (DATABASES.md); compose then skips the dependency on it
    deploy:
      replicas: ${DB_CONTAINERS:-1}
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
      MARIADB_DATABASE: ${MARIADB_SYNCSTORAGE_DATABASE}
      MARIADB_USER: ${MARIADB_SYNCSTORAGE_USER}
      MARIADB_PASSWORD: ${MARIADB_SYNCSTORAGE_PASSWORD}
      MARIADB_AUTO_UPGRADE: "true"
      # the admin UI's reader of the Sync data, created by config/database/admin-user.sh:
      # SELECT and DELETE here (sizes, purges, resets)
      ADMIN_DB_ROLE: storage
      ADMIN_DB_SYNC_USER: ${ADMIN_DB_SYNC_USER:-ffs_admin_sync}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
    command: [sh, /ffs-db/admin-user.sh, mariadbd, --explicit_defaults_for_timestamp]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - syncstorage-db:/var/lib/mysql
      - ./config/database/admin-user.sh:/ffs-db/admin-user.sh:ro
    restart: unless-stopped

  tokenserver_db:
    image: mariadb:lts
    # 0: your own server (DATABASES.md); compose then skips the dependency on it
    deploy:
      replicas: ${DB_CONTAINERS:-1}
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "true"
      MARIADB_DATABASE: ${MARIADB_TOKENSERVER_DATABASE}
      MARIADB_USER: ${MARIADB_TOKENSERVER_USER}
      MARIADB_PASSWORD: ${MARIADB_TOKENSERVER_PASSWORD}
      MARIADB_AUTO_UPGRADE: "true"
      # the admin UI's users, created by config/database/admin-user.sh: ADMIN_DB_USER for its
      # own database (the event log, the audit trail...), ADMIN_DB_SYNC_USER with SELECT
      # and EXECUTE here
      ADMIN_DB_ROLE: tokenserver
      ADMIN_DB_USER: ${ADMIN_DB_USER:-ffs_admin_ui}
      ADMIN_DB_SYNC_USER: ${ADMIN_DB_SYNC_USER:-ffs_admin_sync}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-ffs_admin}
    command: [sh, /ffs-db/admin-user.sh, mariadbd, --explicit_defaults_for_timestamp]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - tokenserver-db:/var/lib/mysql
      - ./config/database/admin-user.sh:/ffs-db/admin-user.sh:ro
    restart: unless-stopped

  tokenserver_db_init:
    image: ${REPOSITORY}:${SYNCSTORAGE_INIT_IMAGE}-${SYNCSTORAGE_INIT_IMAGE_TAG}
    depends_on:
      tokenserver_db:
        condition: service_healthy
      syncstorage_migrate:
        condition: service_completed_successfully
    restart: "no"
    environment:
      MARIADB_SERVER: ${MARIADB_TOKENSERVER_SERVER}
      MARIADB_SERVER_PORT: ${MARIADB_TOKENSERVER_SERVER_PORT}
      MARIADB_DATABASE: ${MARIADB_TOKENSERVER_DATABASE}
      MARIADB_USER: ${MARIADB_TOKENSERVER_USER}
      MARIADB_PASSWORD: ${MARIADB_TOKENSERVER_PASSWORD}
      # false with your own MySQL server: its certificate is self-signed
      MARIADB_TLS_VERIFY: ${MARIADB_TLS_VERIFY:-true}
      MAX_USERS: ${MAX_USERS}
      DOMAIN: ${SYNCSTORAGE_DOMAIN}

  # optional admin UI (COMPOSE_PROFILES=admin), see ADMIN.md
  ffs-admin:
    image: ${ADMIN_IMAGE:-${REPOSITORY}:admin-latest}
    profiles: [admin]
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # initial:N: the admin UI manages max users, otherwise .env does (read-only)
      MAX_USERS: ${MAX_USERS}
      # its own users and database, out of the Sync server's reach (DATABASES.md): one for
      # its database, one that reads the Sync data. Without ADMIN_DB_PASSWORD (an install
      # from before it) the Sync users, and its tables in the tokenserver database: only
      # then do the *_DB_PASSWORD below get their passwords
      ADMIN_DB_USER: ${ADMIN_DB_USER:-ffs_admin_ui}
      ADMIN_DB_SYNC_USER: ${ADMIN_DB_SYNC_USER:-ffs_admin_sync}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-ffs_admin}
      TOKENSERVER_DB_TYPE: mysql
      TOKENSERVER_DB_HOST: ${MARIADB_TOKENSERVER_SERVER}
      TOKENSERVER_DB_PORT: ${MARIADB_TOKENSERVER_SERVER_PORT}
      TOKENSERVER_DB_NAME: ${MARIADB_TOKENSERVER_DATABASE}
      TOKENSERVER_DB_USER: ${MARIADB_TOKENSERVER_USER}
      TOKENSERVER_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-${MARIADB_TOKENSERVER_PASSWORD}}
      # what each account stores (sizes only, the data is encrypted by Firefox)
      STORAGE_DB_HOST: ${MARIADB_SYNCSTORAGE_SERVER}
      STORAGE_DB_PORT: ${MARIADB_SYNCSTORAGE_SERVER_PORT}
      STORAGE_DB_NAME: ${MARIADB_SYNCSTORAGE_DATABASE}
      STORAGE_DB_USER: ${MARIADB_SYNCSTORAGE_USER}
      STORAGE_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-${MARIADB_SYNCSTORAGE_PASSWORD}}
      SYNCSTORAGE_URL: http://syncstorage:8000
      # the setup checks: the Sync node, the keys of the sign-ins, the accounts' email domain
      SYNCSTORAGE_DOMAIN: ${SYNCSTORAGE_DOMAIN}
      FXA_OAUTH_SERVER_URL: ${FXA_OAUTH_SERVER_URL:-}
      FXA_EMAIL_DOMAIN: ${FXA_EMAIL_DOMAIN:-}
      # every hour the public https URLs, their certificates (and the sign-up gate); false: never
      ADMIN_PUBLIC_CHECK: ${ADMIN_PUBLIC_CHECK:-true}
      ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      SMTP_HOST: ${FXA_SMTP_HOST:-}
      SMTP_PORT: ${FXA_SMTP_PORT:-587}
      SMTP_USER: ${FXA_SMTP_USER:-}
      SMTP_PASS: ${FXA_SMTP_PASS:-}
      SMTP_SECURE: ${FXA_SMTP_SECURE:-false}
      SMTP_SENDER: ${FXA_SMTP_SENDER:-}
      METRICS_TOKEN: ${ADMIN_METRICS_TOKEN:-}
      ADMIN_UPDATE_CHECK: ${ADMIN_UPDATE_CHECK:-true}
      ADMIN_STALE_DAYS: ${ADMIN_STALE_DAYS:-90}
      ADMIN_RETENTION_DAYS: ${ADMIN_RETENTION_DAYS:-30}
      ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-365}
      # the alerts on a spike of Sync errors and on the growth of the databases (ADMIN.md)
      ADMIN_ERROR_RATE_PERCENT: ${ADMIN_ERROR_RATE_PERCENT:-10}
      ADMIN_ERROR_RATE_MIN_ERRORS: ${ADMIN_ERROR_RATE_MIN_ERRORS:-20}
      ADMIN_DB_GROWTH_MB: ${ADMIN_DB_GROWTH_MB:-1024}
      ADMIN_DB_GROWTH_FACTOR: ${ADMIN_DB_GROWTH_FACTOR:-5}
      # the daily purge of the Sync storage, the old unconfirmed accounts, sign-up bursts (ADMIN.md)
      ADMIN_PURGE: ${ADMIN_PURGE:-}
      ADMIN_DELETE_UNCONFIRMED_DAYS: ${ADMIN_DELETE_UNCONFIRMED_DAYS:-}
      ADMIN_SIGNUP_BURST: ${ADMIN_SIGNUP_BURST:-10}
      # times of the pages and the alerts, e.g. Europe/Rome (default UTC)
      ADMIN_TZ: ${ADMIN_TZ:-}
      # what the backup service does (COMPOSE_PROFILES=backup), for its help on the overview
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # the commands it shows: compose's (the Quadlets say quadlets)
      ADMIN_DEPLOYMENT: compose
      # the configuration page (no secrets): the databases, where the admin UI is published
      SYNC_DB: ${SYNC_DB:-mariadb}
      ADMIN_EXPORT_PORT: ${ADMIN_EXPORT_PORT:-127.0.0.1:8090}
      # sign-in (see ADMIN.md): ADMIN_PASSWORD, OpenID Connect and/or a trusted proxy's header
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-}
      ADMIN_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-}
      ADMIN_OIDC_CLIENT_SECRET: ${ADMIN_OIDC_CLIENT_SECRET:-}
      ADMIN_OIDC_REDIRECT_URL: ${ADMIN_OIDC_REDIRECT_URL:-}
      ADMIN_OIDC_SCOPES: ${ADMIN_OIDC_SCOPES:-}
      ADMIN_OIDC_NAME: ${ADMIN_OIDC_NAME:-}
      ADMIN_OIDC_GROUPS_CLAIM: ${ADMIN_OIDC_GROUPS_CLAIM:-}
      ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL: ${ADMIN_OIDC_TRUST_UNVERIFIED_EMAIL:-}
      ADMIN_AUTH_HEADER: ${ADMIN_AUTH_HEADER:-}
      ADMIN_AUTH_GROUPS_HEADER: ${ADMIN_AUTH_GROUPS_HEADER:-}
      ADMIN_TRUSTED_PROXIES: ${ADMIN_TRUSTED_PROXIES:-}
      ADMIN_ALLOWED_USERS: ${ADMIN_ALLOWED_USERS:-}
      ADMIN_ALLOWED_GROUPS: ${ADMIN_ALLOWED_GROUPS:-}
    depends_on:
      tokenserver_db_init:
        condition: service_completed_successfully
    ports:
      - ${ADMIN_EXPORT_PORT:-127.0.0.1:8090}:8080
    restart: unless-stopped

  # optional nightly backups (COMPOSE_PROFILES=backup) of the tokenserver and storage
  # databases into the backups volume, see ADMIN.md#backups. Run one now:
  # docker compose exec backup sh /ffs-backup/backup.sh now
  backup:
    image: mariadb:lts
    profiles: [backup]
    entrypoint: [sh, /ffs-backup/backup.sh]
    command: [loop]
    environment:
      BACKUP_SCOPE: sync
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      MARIADB_TLS_VERIFY: ${MARIADB_TLS_VERIFY:-true}
      TOKENSERVER_DB_TYPE: mysql
      TOKENSERVER_DB_HOST: ${MARIADB_TOKENSERVER_SERVER}
      TOKENSERVER_DB_PORT: ${MARIADB_TOKENSERVER_SERVER_PORT}
      TOKENSERVER_DB_NAME: ${MARIADB_TOKENSERVER_DATABASE}
      TOKENSERVER_DB_USER: ${MARIADB_TOKENSERVER_USER}
      TOKENSERVER_DB_PASSWORD: ${MARIADB_TOKENSERVER_PASSWORD}
      STORAGE_DB_HOST: ${MARIADB_SYNCSTORAGE_SERVER}
      STORAGE_DB_PORT: ${MARIADB_SYNCSTORAGE_SERVER_PORT}
      STORAGE_DB_NAME: ${MARIADB_SYNCSTORAGE_DATABASE}
      STORAGE_DB_USER: ${MARIADB_SYNCSTORAGE_USER}
      STORAGE_DB_PASSWORD: ${MARIADB_SYNCSTORAGE_PASSWORD}
      # the admin UI's database: dumped too, and where the runs are recorded
      ADMIN_DB_USER: ${ADMIN_DB_USER:-ffs_admin_ui}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-}
      ADMIN_DB_NAME: ${ADMIN_DB_NAME:-ffs_admin}
    volumes:
      - ./config/backup:/ffs-backup:ro
      - backups:/backups
    depends_on:
      tokenserver_db_init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  syncstorage-db:
  tokenserver-db:
  backups:
