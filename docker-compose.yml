# For the installs from before compose/ (docs/upgrading.md#files-that-moved) that never set
# COMPOSE_FILE: a plain `docker compose` here still runs Sync on MariaDB, as this file did.
# Nothing else uses it: the setup writes COMPOSE_FILE with the files of compose/
# (docs/install/compose.md#the-compose-files); ./prepare_environment.sh --upgrade does too.
include:
  - path: [compose/sync.yml, compose/sync-mariadb.yml]
