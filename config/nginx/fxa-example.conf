# Self-hosted Mozilla accounts (docker-compose.fxa.yml), next to syncstorage-rs.conf
# The host names must match FXA_CONTENT_URL, FXA_AUTH_URL and FXA_PROFILE_URL in .env
# X-Forwarded-For is required: the accounts service rate limits sign-ins per client IP

server {
  server_name <ACCOUNTS_HOST> <API_HOST> <PROFILE_HOST>;
  listen 80;
  listen [::]:80;
  return 301 https://$host$request_uri;
}

server {
  server_name <ACCOUNTS_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<ACCOUNTS_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<ACCOUNTS_HOST>/privkey.pem;

  location / {
    proxy_pass http://<CONTENT_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

server {
  server_name <API_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<API_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<API_HOST>/privkey.pem;

  location / {
    proxy_pass http://<AUTH_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

server {
  server_name <PROFILE_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<PROFILE_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<PROFILE_HOST>/privkey.pem;

  location /img/ {
    proxy_pass http://<PROFILE_STATIC_EXPORT_PORT>/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
  location / {
    proxy_pass http://<PROFILE_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

