# Self-hosted Mozilla accounts (docker-compose.fxa.yml), next to syncstorage-rs.conf
# The host names must match FXA_CONTENT_URL, FXA_AUTH_URL and FXA_PROFILE_URL in .env
# X-Forwarded-For is required: the accounts service rate limits sign-ins per client IP, taken
# FXA_CLIENT_ADDRESS_DEPTH (2: this proxy only) from the end of it. Another proxy in front
# (e.g. a CDN or load balancer)? Add 1 per proxy.

server {
  server_name <ACCOUNTS_HOST> <API_HOST> <PROFILE_HOST>;
  listen 80;
  listen [::]:80;
  return 301 https://$host$request_uri;
}

server {
  server_name <ACCOUNTS_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<ACCOUNTS_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<ACCOUNTS_HOST>/privkey.pem;

  location / {
    proxy_pass http://<CONTENT_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

server {
  server_name <API_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<API_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<API_HOST>/privkey.pem;

  # admin UI only (COMPOSE_PROFILES=admin): the sign-up gate answers refused sign-ups
  # with an error the accounts pages show (without it they are refused all the same)
  location = /v1/account/create {
    proxy_pass http://<ADMIN_GATE_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  location / {
    proxy_pass http://<AUTH_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

server {
  server_name <PROFILE_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<PROFILE_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<PROFILE_HOST>/privkey.pem;

  location /img/ {
    proxy_pass http://<PROFILE_STATIC_EXPORT_PORT>/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
  location / {
    proxy_pass http://<PROFILE_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }
}

# admin UI sign-in only (ADMIN_OIDC_REDIRECT_URL): the admin UI on a host name of its own,
# where the accounts pages send you back after signing in. Only from your own addresses
server {
  server_name <ADMIN_HOST>;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/letsencrypt/live/<ADMIN_HOST>/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/<ADMIN_HOST>/privkey.pem;
  allow 127.0.0.1;
  allow ::1;
  # allow 192.0.2.0/24;  # your network
  deny all;

  location / {
    proxy_pass http://<ADMIN_EXPORT_PORT>;
    # the forms check that they are posted from the same site
    proxy_set_header Host $http_host;
    proxy_redirect off;
  }
}
# end of the admin UI sign-in

