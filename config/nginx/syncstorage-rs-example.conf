server {
  if ($host = firefox-sync.example.com) {
    return 301 https://$host$request_uri;
  }

  listen 80;
  listen [::]:80;
  server_name firefox-sync.example.com;

  # a Sync request can be up to 2.5 MB (syncstorage-rs SYNC_SYNCSTORAGE__LIMITS__MAX_REQUEST_BYTES),
  # more than nginx's 1 MB default: without this, large batches fail with 413
  client_max_body_size 10m;

  access_log /var/log/nginx/firefox-sync.example.com-access.log;
  error_log /var/log/nginx/firefox-sync.example.com-error.log;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;

  http2 on;

  server_name firefox-sync.example.com;

  location / {
    # the Sync server where SYNC_EXPORT_PORT of .env listens (prepare_environment.sh: 127.0.0.1:5000)
    proxy_pass http://localhost:<SYNC_EXPORT_PORT>;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 120;
    proxy_connect_timeout 10;
    gzip off;
  }

  ssl_certificate /etc/letsencrypt/live/firefox-sync.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/firefox-sync.example.com/privkey.pem;
}