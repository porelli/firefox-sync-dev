apiVersion: v2
name: firefox-sync
description: Self-hosted Firefox Sync server with syncstorage-rs, tokenserver, and optional admin UI
type: application
version: 0.2.0
# appVersion (informational: helm list, the app.kubernetes.io/version label; the images that run
# are those of image.*Tag) is set when the chart is published, helm package --app-version: the
# syncstorage-rs release its default images (latest) run then (.github/workflows/helm.yml)
# CronJob timeZone (GA in 1.27): the backups run in UTC
kubeVersion: ">=1.27.0-0"
keywords:
  - firefox
  - sync
  - syncstorage
  - tokenserver
home: https://github.com/porelli/firefox-sync
sources:
  - https://github.com/porelli/firefox-sync
annotations:
  # where this chart is published, for the helm upgrade commands the admin UI shows
  # (ADMIN_K8S_CHART): the publish job of .github/workflows/helm.yml sets it to its repository's
  org.firefox-sync/chart: oci://ghcr.io/porelli/firefox-sync/charts/firefox-sync
maintainers:
  - name: Michele Porelli
    url: https://github.com/porelli
