# Default values for firefox-sync
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration
image:
  repository: ghcr.io/porelli/firefox-sync
  pullPolicy: IfNotPresent
  # Tags for different components
  syncstorageTag: latest
  initTag: latest
  adminTag: latest

# Public domain for the Firefox Sync service (required)
# Example: https://sync.example.com
syncDomain: ""

# Maximum users allowed to use this server
# Formats: "N", "fixed:N", "initial:N", "unlimited", "initial:unlimited"
# - N or fixed:N: set on every start, read-only in admin UI
# - initial:N: set once on first start, then managed in admin UI
# (a number like 5 is taken as "5")
maxUsers: "1"

# Firefox Accounts configuration
fxa:
  # OAuth server URL for Firefox Accounts
  oauthServerUrl: https://oauth.accounts.firefox.com/v1
  # Email domain for Firefox Accounts
  emailDomain: api.accounts.firefox.com

# Database configuration
database:
  # Backend type: mariadb, mysql, or postgres
  backend: mariadb

  # Whether to deploy bundled database containers
  bundled: true

  # External database configuration (used when bundled: false)
  external:
    # Database host
    host: ""
    # Database port
    port: 3306
    # Tokenserver database name
    tokenserverDatabase: tokenserver
    # Storage database name (ignored for postgres backend)
    storageDatabase: syncstorage
    # Tokenserver database user
    tokenserverUser: tokenserver
    # Storage database user (ignored for postgres backend)
    storageUser: syncstorage
    # TLS certificate verification
    tlsVerify: true

  # Persistence configuration for bundled databases
  persistence:
    # Size of persistent volume
    size: 8Gi
    # Storage class (empty for default)
    storageClass: ""

# Name of existing secret containing database passwords and secrets, with the keys
# SYNC_MASTER_SECRET, METRICS_HASH_SECRET, ADMIN_PASSWORD, ADMIN_DB_PASSWORD (the admin UI's
# database users) and TOKENSERVER_DB_PASSWORD + STORAGE_DB_PASSWORD (mariadb, mysql) or
# POSTGRES_PASSWORD (the superuser) + POSTGRES_SYNC_PASSWORD (the Sync server's role) (postgres);
# optional, for the admin UI (missing or empty: that feature off): FXA_SMTP_PASS,
# ADMIN_OIDC_CLIENT_SECRET, ADMIN_METRICS_TOKEN, ADMIN_NOTIFY. The admin.password,
# admin.smtp.password, admin.oidc.clientSecret, admin.metricsToken and admin.notify values
# are ignored then.
# Without existingSecret those four are managed by the values alone: written into the
# chart's Secret on every install and upgrade, an empty value is an empty key (the feature
# off), whatever was set in the Secret by hand. Manage them out of band with existingSecret.
# If not set, a secret named like the release (<release>-firefox-sync) is generated on the
# first install and kept as it is on upgrades (and on uninstall, like the database volumes).
# REQUIRED when the chart is rendered with `helm template` or a GitOps tool that renders it
# (Argo CD...): there the chart cannot read the Secret back from the cluster, and
# would generate a new SYNC_MASTER_SECRET, METRICS_HASH_SECRET and database passwords on
# every render (every Firefox signed out, the databases refusing the new passwords)
existingSecret: ""

# Syncstorage service configuration
syncstorage:
  # Number of replicas: more than one runs the migrations and the MAX_USERS init
  # concurrently, which is not tested
  replicas: 1

  # Resource limits and requests
  resources: {}
    # limits:
    #   cpu: 1000m
    #   memory: 512Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Service configuration
  service:
    # Service port
    port: 8000

# The admin UI (compose's ffs-admin, see ADMIN.md): max users, accounts, health, metrics,
# alerts. Not published: kubectl port-forward svc/<release>-firefox-sync-admin 8090:8080,
# or admin.ingress below behind your own sign-in. The Sync server sends it its metrics
# (statsd, SYNC_STATSD_HOST) only while it is on. As in .env-example, with the names of .env
admin:
  enabled: false
  # ADMIN_PASSWORD: empty generates one into the Secret (kept on upgrades); read it with
  # kubectl get secret <release>-firefox-sync -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
  password: ""
  # ADMIN_ALERT_EMAIL: email alerts (refused sign-ups, components down, new releases, admin
  # sign-ins), sent with the SMTP server below
  alertEmail: ""
  # FXA_SMTP_*: the SMTP server of the alerts and invitations (empty host: no emails);
  # the password (FXA_SMTP_PASS) goes into the Secret, as the values say (see existingSecret)
  smtp:
    host: ""
    port: 587
    user: ""
    password: ""
    # true: TLS from the start (port 465); false: STARTTLS
    secure: false
    sender: ""
  # ADMIN_OIDC_*: sign-in with OpenID Connect (ADMIN.md#signing-in); the client secret
  # (ADMIN_OIDC_CLIENT_SECRET, empty: a public client) goes into the Secret, as the values say
  oidc:
    issuer: ""
    clientId: ""
    clientSecret: ""
    # the exact public callback URL, https://<admin host>/auth/callback
    redirectUrl: ""
    # default "openid email profile"
    scopes: ""
    # the button label, default "single sign-on"
    name: ""
    # the claim with the groups, default "groups"
    groupsClaim: ""
    # true: accept emails without email_verified=true (risky, see ADMIN.md)
    trustUnverifiedEmail: ""
  # ADMIN_AUTH_HEADER, ADMIN_AUTH_GROUPS_HEADER, ADMIN_TRUSTED_PROXIES: sign-in with the
  # header of a forward-auth proxy, only from these CIDRs (the proxy as the pod sees it)
  trustedHeader:
    header: ""
    groupsHeader: ""
    trustedProxies: ""
  # ADMIN_ALLOWED_USERS, ADMIN_ALLOWED_GROUPS: with OpenID Connect or the header, who is an
  # admin (emails and @domains, groups; comma-separated)
  allowed:
    users: ""
    groups: ""
  # ADMIN_NOTIFY: alerts also to Slack, Discord, Teams, ntfy, Gotify, Telegram, Matrix or
  # a webhook (ADMIN.md#alerts): a list of URLs, one per destination (or one string, the
  # URLs separated by commas, as in .env), e.g.
  #   notify: ["ntfy://ntfy.sh/my-secret-topic", "slack://hooks.slack.com/services/T000/B000/XXXX"]
  # They hold tokens: into the Secret as the values say (empty: off, see existingSecret)
  notify: []
  # ADMIN_METRICS_TOKEN: Prometheus metrics at /metrics with this bearer token (empty:
  # off), into the Secret as the values say
  metricsToken: ""
  # ADMIN_TZ: time zone of the pages and the alerts, e.g. Europe/Rome (empty: UTC)
  tz: ""
  # ADMIN_PUBLIC_CHECK: every hour the public https URLs and their certificates (false: never)
  publicCheck: true
  # ADMIN_UPDATE_CHECK: compare the running versions with the newest releases on GitHub
  updateCheck: true
  # ADMIN_STALE_DAYS: accounts not synced for this many days are marked inactive
  staleDays: 90
  # ADMIN_RETENTION_DAYS, ADMIN_AUDIT_RETENTION_DAYS: days of metrics and events, and of the
  # events of the admins, kept
  retentionDays: 30
  auditRetentionDays: 365
  # ADMIN_PURGE: "1" deletes the Sync data nobody reads any more every day (ADMIN.md#storage)
  purge: ""
  # ADMIN_ERROR_RATE_PERCENT, ADMIN_ERROR_RATE_MIN_ERRORS: an alert on a spike of Sync errors
  errorRatePercent: 10
  errorRateMinErrors: 20
  # ADMIN_DB_GROWTH_MB, ADMIN_DB_GROWTH_FACTOR: an alert on a database growing fast
  dbGrowthMb: 1024
  dbGrowthFactor: 5
  # the self-hosted accounts only (not in this chart yet), passed as compose does:
  # ADMIN_DELETE_UNCONFIRMED_DAYS, ADMIN_SIGNUP_BURST
  deleteUnconfirmedDays: ""
  signupBurst: 10

  resources: {}

  # Admin ingress configuration (used when admin.enabled: true)
  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""
    annotations: {}

# The backups, compose's backup service (ADMIN.md#backups): a CronJob <release>-firefox-sync-backup
# dumps the Sync databases and the admin UI's into the PVC <release>-firefox-sync-backups
# (kept on helm uninstall), sync/<UTC time>/<database>.sql.gz, as the stack's users (PostgreSQL:
# the Sync server's role, never the superuser); each run shows on the admin UI's Backups card.
# One now: kubectl create job --from=cronjob/<release>-firefox-sync-backup backup-now
# Restoring: ADMIN.md#restoring. For the bundled databases; with your own servers, their backups
backup:
  enabled: false
  # cron format, in UTC (the CronJob's timeZone). A daily "M H * * *" is also BACKUP_TIME
  # (HH:MM) of the admin UI's help; any other schedule runs as given, but the admin UI then
  # says its default time, 03:00
  schedule: "0 3 * * *"
  # BACKUP_KEEP: the newest runs kept, older ones deleted (a failed run deletes nothing)
  keep: 7
  persistence:
    size: 10Gi
    storageClass: ""

# Ingress configuration
ingress:
  enabled: false
  className: ""
  # Hostname for the sync service
  host: ""
  # TLS configuration
  tls:
    enabled: false
    secretName: ""
  # Additional annotations
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
