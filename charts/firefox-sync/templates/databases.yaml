{{- /*
The bundled databases, as compose's tokenserver_db and syncstorage_db (MariaDB, or MySQL
with docker-compose.sync-mysql.yml) or postgres_db (docker-compose.sync-postgres.yml)
*/ -}}
{{- if .Values.database.bundled }}
{{- $root := . }}
{{- $backend := .Values.database.backend }}
{{- $persistence := .Values.database.persistence }}
{{- $dbs := list }}
{{- if eq $backend "postgres" }}
{{- $dbs = list (dict "component" "postgres" "db" "tokenserver") }}
{{- else }}
{{- $dbs = list (dict "component" "tokenserver-db" "db" "tokenserver") (dict "component" "storage-db" "db" "storage") }}
{{- end }}
{{- if ne $backend "postgres" }}
---
# db/mysql/admin-user.sh (a copy in files/, kept identical): the admin UI's users, run by the
# MariaDB and MySQL containers before the image's entrypoint, as in compose
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "firefox-sync.fullname" $root }}-db-scripts
  labels:
    {{- include "firefox-sync.labels" (dict "root" $root "component" "db-scripts") | nindent 4 }}
data:
  admin-user.sh: |
    {{- $root.Files.Get "files/admin-user.sh" | trimSuffix "\n" | nindent 4 }}
{{- end }}
{{- range $dbs }}
{{- $component := .component }}
{{- $role := .db }}
{{- $name := include "firefox-sync.dbHost" (dict "root" $root "db" .db) }}
{{- $dbName := include "firefox-sync.dbName" (dict "root" $root "db" .db) }}
{{- $dbUser := include "firefox-sync.dbUser" (dict "root" $root "db" .db) }}
{{- $passwordKey := include "firefox-sync.dbPasswordKey" (dict "root" $root "db" .db) }}
{{- $port := include "firefox-sync.dbPort" (dict "root" $root) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "firefox-sync.selectorLabels" (dict "root" $root "component" $component) | nindent 4 }}
  ports:
    - name: db
      port: {{ $port }}
      targetPort: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "firefox-sync.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firefox-sync.selectorLabels" (dict "root" $root "component" $component) | nindent 8 }}
      {{- if ne $backend "postgres" }}
      annotations:
        # admin-user.sh runs at the start: a new pod when it changes
        checksum/db-scripts: {{ $root.Files.Get "files/admin-user.sh" | sha256sum }}
      {{- end }}
    spec:
      containers:
        {{- $check := list }}
        - name: db
          image: {{ include "firefox-sync.dbImage" $root }}
          {{- if eq $backend "mariadb" }}
          args: [sh, /ffs-db/admin-user.sh, mariadbd, --explicit_defaults_for_timestamp]
          env:
            - name: MARIADB_RANDOM_ROOT_PASSWORD
              value: "true"
            - name: MARIADB_DATABASE
              value: {{ $dbName | quote }}
            - name: MARIADB_USER
              value: {{ $dbUser | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $root "name" "MARIADB_PASSWORD" "key" $passwordKey) | nindent 12 }}
            - name: MARIADB_AUTO_UPGRADE
              value: "true"
            {{- include "firefox-sync.adminUserEnv" (dict "root" $root "role" $role) | nindent 12 }}
          {{- $check = list "healthcheck.sh" "--connect" "--innodb_initialized" }}
          {{- else if eq $backend "mysql" }}
          # no binary logging, as docker-compose.sync-mysql.yml: the init container's MAX_USERS
          # procedure and trigger would otherwise need log_bin_trust_function_creators
          args: [sh, /ffs-db/admin-user.sh, mysqld, --disable-log-bin]
          env:
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              value: {{ $dbName | quote }}
            - name: MYSQL_USER
              value: {{ $dbUser | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $root "name" "MYSQL_PASSWORD" "key" $passwordKey) | nindent 12 }}
            {{- include "firefox-sync.adminUserEnv" (dict "root" $root "role" $role) | nindent 12 }}
          {{- $check = list "sh" "-c" "mysqladmin ping -h 127.0.0.1 --protocol=tcp -u\"${MYSQL_USER}\" -p\"${MYSQL_PASSWORD}\" --silent" }}
          {{- else }}
          env:
            - name: POSTGRES_DB
              value: {{ $dbName | quote }}
            - name: POSTGRES_USER
              value: {{ $dbUser | quote }}
            {{- include "firefox-sync.secretEnv" (dict "root" $root "name" "POSTGRES_PASSWORD" "key" $passwordKey) | nindent 12 }}
          {{- $check = list "sh" "-c" "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\"" }}
          {{- end }}
          # compose's healthcheck. The first start (a new database, or a long recovery) has
          # up to 30 minutes; ready as compose's healthy; restarted only after 5 minutes
          # without an answer, compose would only mark it unhealthy
          startupProbe:
            exec:
              command: {{ toJson $check }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command: {{ toJson $check }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: {{ ternary 10 3 (eq $backend "mysql") }}
          livenessProbe:
            exec:
              command: {{ toJson $check }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          ports:
            - name: db
              containerPort: {{ $port }}
          volumeMounts:
            - name: data
              {{- if eq $backend "postgres" }}
              # postgres:18 and later keep their data in a subdirectory of the major
              # (PGDATA /var/lib/postgresql/18/docker): a new major does not open the old data
              mountPath: /var/lib/postgresql
              {{- else }}
              # a subdirectory: MariaDB and MySQL refuse to initialise next to the lost+found
              # of a fresh ext4 volume
              mountPath: /var/lib/mysql
              subPath: data
            - name: db-scripts
              mountPath: /ffs-db
              readOnly: true
              {{- end }}
      {{- if ne $backend "postgres" }}
      volumes:
        - name: db-scripts
          configMap:
            name: {{ include "firefox-sync.fullname" $root }}-db-scripts
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $persistence.size }}
{{- end }}
{{- end }}
