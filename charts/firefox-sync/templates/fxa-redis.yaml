{{- /*
The accounts' Redis, compose's fxa-redis: caches and rate-limit counters, in memory (an
emptyDir, as compose's anonymous volume). The sessions and refresh tokens are in the database:
a new pod signs nobody out. Chart-only: its password (FXA_REDIS_PASSWORD) and the
NetworkPolicy of fxa-networkpolicy.yaml, compose's Redis is on a network of its own
*/ -}}
{{- if .Values.fxa.enabled }}
{{- $name := printf "%s-fxa-redis" (include "firefox-sync.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" . "component" "fxa-redis") | nindent 4 }}
spec:
  selector:
    {{- include "firefox-sync.selectorLabels" (dict "root" . "component" "fxa-redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" . "component" "fxa-redis") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "firefox-sync.selectorLabels" (dict "root" . "component" "fxa-redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firefox-sync.selectorLabels" (dict "root" . "component" "fxa-redis") | nindent 8 }}
      {{- /* a new pod when the chart's Secret changes (its FXA_REDIS_PASSWORD, read at the
      start; existingSecret: restart it yourself), as the accounts' servers */}}
      {{- $annotations := dict }}
      {{- if not .Values.existingSecret }}
      {{- $_ := set $annotations "checksum/secrets" (include "firefox-sync.secretData" . | sha256sum) }}
      {{- end }}
      {{- with include "firefox-sync.podAnnotations" (dict "root" . "annotations" $annotations) }}{{ . | trim | nindent 6 }}{{ end }}
    spec:
      {{- include "firefox-sync.podSpec" . | nindent 6 }}
      # the image's user redis (999, group 1000), by number: nothing to chown in /data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.fxa.redis.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with .Values.fxa.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # its password, also redis-cli's (the probes)
            {{- include "firefox-sync.secretEnv" (dict "root" . "name" "REDISCLI_AUTH" "key" "FXA_REDIS_PASSWORD") | nindent 12 }}
          # the image's redis-server, its password in the configuration read from stdin: not
          # in the pod spec, nor in the process' arguments. Every byte of it as \xHH in Redis'
          # double quotes: a password of an existingSecret with spaces, quotes or a newline is
          # read as it is
          command: [/bin/sh, -c]
          args:
            - |
              pass=$(printf %s "$REDISCLI_AUTH" | od -An -v -tx1 | tr -d ' \n' | sed 's/../\\x&/g')
              exec redis-server - <<EOF
              requirepass "$pass"
              EOF
          ports:
            - name: redis
              containerPort: 6379
          # compose's healthcheck
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
