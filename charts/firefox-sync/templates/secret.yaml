{{- /*
The secrets of the stack (the .env-example passwords and secrets): generated on the first
install, then read back from the cluster on every upgrade, so that SYNC_MASTER_SECRET,
METRICS_HASH_SECRET and the database passwords never change. With existingSecret the
chart creates none and reads the same keys from that Secret.
*/ -}}
{{- if not .Values.existingSecret }}
{{- $name := include "firefox-sync.fullname" . }}
{{- $data := include "firefox-sync.secretData" . | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" .) | nindent 4 }}
  annotations:
    # kept on helm uninstall, like the database volumes: a reinstall finds the passwords
    # the databases were created with
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}
