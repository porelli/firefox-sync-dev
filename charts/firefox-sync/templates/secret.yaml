{{- /*
The secrets of the stack (the .env-example passwords and secrets): generated on the first
install, then read back from the cluster on every upgrade, so that SYNC_MASTER_SECRET,
METRICS_HASH_SECRET and the database passwords never change. With existingSecret the
chart creates none and reads the same keys from that Secret.
*/ -}}
{{- if not .Values.existingSecret }}
{{- $name := include "firefox-sync.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = deepCopy ($existing.data | default dict) }}
{{- end }}
{{- /* ADMIN_DB_PASSWORD: the admin UI's own database users, also created by the bundled
databases and the init container (compose's ADMIN_DB_PASSWORD, prepare_environment.sh
generates it); POSTGRES_SYNC_PASSWORD: the Sync server's own role, POSTGRES_PASSWORD
the superuser's */ -}}
{{- $keys := list "SYNC_MASTER_SECRET" "METRICS_HASH_SECRET" "ADMIN_PASSWORD" "ADMIN_DB_PASSWORD" }}
{{- if eq .Values.database.backend "postgres" }}
{{- $keys = concat $keys (list "POSTGRES_PASSWORD" "POSTGRES_SYNC_PASSWORD") }}
{{- else }}
{{- $keys = concat $keys (list "TOKENSERVER_DB_PASSWORD" "STORAGE_DB_PASSWORD") }}
{{- end }}
{{- range $keys }}
{{- if not (hasKey $data .) }}
{{- $_ := set $data . (randAlphaNum 32 | b64enc) }}
{{- end }}
{{- end }}
{{- /* the admin UI's password when given; and its optional secrets (.env's names), empty
for a feature off: a value given replaces them, otherwise they stay as they are in the
cluster (also when set there with kubectl) */ -}}
{{- $given := dict "ADMIN_PASSWORD" .Values.admin.password "FXA_SMTP_PASS" .Values.admin.smtp.password
  "ADMIN_OIDC_CLIENT_SECRET" .Values.admin.oidc.clientSecret "ADMIN_METRICS_TOKEN" .Values.admin.metricsToken }}
{{- range $key, $value := $given }}
{{- if $value }}
{{- $_ := set $data $key ($value | toString | b64enc) }}
{{- else if not (hasKey $data $key) }}
{{- $_ := set $data $key "" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "firefox-sync.labels" (dict "root" .) | nindent 4 }}
  annotations:
    # kept on helm uninstall, like the database volumes: a reinstall finds the passwords
    # the databases were created with
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}
